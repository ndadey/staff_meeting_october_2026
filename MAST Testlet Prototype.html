document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

m\">MAST Science · Grade 7 topic testlet · design prototype<\u002Fspan>\n  <label style=\"display:flex;align-items:center;gap:6px;color:oklch(0.8 0.01 258)\">Screen\n    <sc-raw-select value=\"{{ screen }}\" sc-camel-on-change=\"{{ onScreenSelect }}\" style=\"font-size:13px;padding:3px 6px;border-radius:4px;border:1px solid oklch(0.4 0.02 258);background:oklch(0.3 0.02 258);color:#fff\">\n      <option value=\"signin\">0 · Sign in<\u002Foption>\n      <option value=\"welcome\">0 · Welcome<\u002Foption>\n      <option value=\"tests\">0 · Take a test<\u002Foption>\n      <option value=\"code\">0 · Access code<\u002Foption>\n      <option value=\"directions\">0 · Directions<\u002Foption>\n      <option value=\"a0\">1 · Cluster A opener<\u002Foption>\n      <option value=\"a1\">2 · A1 Describe the pattern<\u002Foption>\n      <option value=\"a2\">3 · A2 Which claims<\u002Foption>\n      <option value=\"a3\">4 · A3 Order the model<\u002Foption>\n      <option value=\"a4\">5 · A4 Proportion<\u002Foption>\n      <option value=\"a5\">6 · A5 Claim, evidence, reasoning<\u002Foption>\n      <option value=\"a6\">7 · A6 Harvest rule + model<\u002Foption>\n      <option value=\"b0\">8 · Cluster B opener<\u002Foption>\n      <option value=\"b1\">9 · B1 Rock layers<\u002Foption>\n      <option value=\"b2\">10 · B2 Shared structure<\u002Foption>\n      <option value=\"b3\">11 · B3 Classify embryo features<\u002Foption>\n      <option value=\"b4\">12 · B4 Argue relationship<\u002Foption>\n      <option value=\"review\">13 · Review/End<\u002Foption>\n      <option value=\"confirm\">13 · End confirmation<\u002Foption>\n      <option value=\"done\">13 · Signed out<\u002Foption>\n      <option value=\"closing\">14 · Closing map (notes only)<\u002Foption>\n    <\u002Fsc-raw-select>\n  <\u002Flabel>\n  <span style=\"flex:1\"><\u002Fspan>\n  <button sc-camel-on-click=\"{{ toggleNotes }}\" aria-pressed=\"{{ notesOpen }}\" style=\"font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid {{ notesBtnBd }};background:{{ notesBtnBg }};color:{{ notesBtnFg }};cursor:pointer\">Design notes: {{ notesLabel }}<\u002Fbutton>\n  <button sc-camel-on-click=\"{{ restart }}\" style=\"font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid oklch(0.45 0.02 258);background:transparent;color:oklch(0.9 0.01 258);cursor:pointer\">Restart<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"flex:1;display:flex;min-height:0\">\n<div style=\"flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;position:relative;overflow:hidden\">\n\n  <div style=\"display:flex;align-items:center;gap:12px;padding:0 16px;height:38px;background:oklch(0.50 0.17 258);color:#fff;font-size:14px;flex:none\">\n    <span style=\"font-weight:700;letter-spacing:.04em\">STUDENT PORTAL<\u002Fspan>\n    <span style=\"flex:1;text-align:center;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ hdr.test }}<\u002Fspan>\n    <span style=\"font-weight:600\">{{ hdr.student }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ scr.signin }}\" hint-placeholder-val=\"{{ true }}\">\n  <div data-screen-label=\"Sign in\" style=\"flex:1;display:grid;place-items:center;background:oklch(0.975 0.004 258);overflow:auto\">\n    <form sc-camel-on-submit=\"{{ signIn }}\" style=\"width:min(360px,90%);background:#fff;border:1px solid oklch(0.88 0.006 258);border-radius:8px;padding:32px;display:flex;flex-direction:column;gap:18px;box-shadow:0 2px 10px oklch(0 0 0 / 0.05)\">\n      <div style=\"font-size:22px;font-weight:700;color:oklch(0.50 0.17 258)\">Student Portal<\u002Fdiv>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:oklch(0.48 0.015 258)\">USERNAME\n        <input value=\"{{ signinUser }}\" sc-camel-on-change=\"{{ onUserChange }}\" autocomplete=\"off\" style=\"font-size:16px;padding:10px 12px;border:1px solid oklch(0.80 0.01 258);border-radius:4px;font-weight:400;letter-spacing:0;color:oklch(0.22 0.01 258)\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:oklch(0.48 0.015 258)\">PASSWORD\n        <input type=\"password\" value=\"{{ signinPass }}\" sc-camel-on-change=\"{{ onPassChange }}\" style=\"font-size:16px;padding:10px 12px;border:1px solid oklch(0.80 0.01 258);border-radius:4px;font-weight:400;letter-spacing:0;color:oklch(0.22 0.01 258)\">\n      <\u002Flabel>\n      <button type=\"submit\" style=\"margin-top:4px;font-size:15px;font-weight:700;letter-spacing:.06em;padding:12px;border:0;border-radius:4px;background:oklch(0.50 0.17 258);color:#fff;cursor:pointer\">SIGN IN<\u002Fbutton>\n    <\u002Fform>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scr.welcome }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Welcome\" style=\"flex:1;display:grid;place-items:center;background:oklch(0.975 0.004 258)\">\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center\">\n      <div style=\"font-size:28px;font-weight:700\">Welcome, Avery R.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ takeTest }}\" style=\"font-size:18px;font-weight:700;letter-spacing:.06em;padding:16px 40px;border:0;border-radius:6px;background:oklch(0.50 0.17 258);color:#fff;cursor:pointer\">TAKE A TEST<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ signOut }}\" style=\"background:none;border:0;color:oklch(0.50 0.17 258);font-size:14px;cursor:pointer;text-decoration:underline\">Sign Out<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scr.tests }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Take a test\" style=\"flex:1;overflow:auto;padding:32px 20px;background:oklch(0.975 0.004 258)\">\n    <div style=\"width:min(760px,100%);margin:0 auto;display:flex;flex-direction:column;gap:14px\">\n      <h1 style=\"margin:0;font-size:22px\">Your assessments<\u002Fh1>\n      <p style=\"margin:0;color:oklch(0.48 0.015 258);font-size:15px\">Choose the test your teacher told you to take today.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;border:1px solid oklch(0.88 0.006 258);border-radius:8px;background:#fff;overflow:hidden\">\n        <sc-for list=\"{{ tests }}\" as=\"t\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-bottom:1px solid oklch(0.88 0.006 258)\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-weight:600;font-size:16px\">{{ t.title }}<\u002Fspan><span style=\"font-size:13px;color:oklch(0.48 0.015 258)\">{{ t.sub }}<\u002Fspan><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"flex:none;font-size:14px;font-weight:700;padding:9px 18px;border:0;border-radius:4px;background:oklch(0.50 0.17 258);color:#fff;cursor:pointer\">Take Test<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ testsMsgShow }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"status\" style=\"margin:0;padding:10px 12px;background:oklch(0.975 0.025 80);border:1px solid oklch(0.86 0.07 80);border-radius:6px;font-size:14px\">{{ testsMsg }}<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scr.code }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Access code\" style=\"flex:1;display:grid;place-items:center;background:oklch(0.975 0.004 258)\">\n    <form sc-camel-on-submit=\"{{ submitCode }}\" style=\"width:min(440px,90%);background:#fff;border:1px solid oklch(0.88 0.006 258);border-radius:8px;padding:32px;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font-size:20px;font-weight:700;line-height:1.3\">Science Grade 7: Natural Selection and Adaptations<\u002Fdiv>\n      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:oklch(0.48 0.015 258)\">DAILY ACCESS CODE\n        <input value=\"{{ codeVal }}\" sc-camel-on-change=\"{{ onCodeChange }}\" placeholder=\"Type the code your teacher gives you\" autocomplete=\"off\" style=\"font-size:18px;letter-spacing:.1em;padding:10px 12px;border:1px solid oklch(0.80 0.01 258);border-radius:4px;font-weight:600;color:oklch(0.22 0.01 258)\">\n      <\u002Flabel>\n      <div style=\"display:flex;justify-content:space-between;gap:10px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ toTests }}\" style=\"font-size:14px;font-weight:700;letter-spacing:.04em;padding:10px 18px;border:1.5px solid oklch(0.50 0.17 258);border-radius:4px;background:#fff;color:oklch(0.50 0.17 258);cursor:pointer\">GO BACK<\u002Fbutton>\n        <button type=\"submit\" style=\"font-size:14px;font-weight:700;letter-spacing:.04em;padding:10px 22px;border:1.5px solid oklch(0.50 0.17 258);border-radius:4px;background:oklch(0.50 0.17 258);color:#fff;cursor:pointer\">SUBMIT<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fform>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scr.directions }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Directions\" style=\"flex:1;overflow:auto;padding:32px 20px;background:oklch(0.975 0.004 258)\">\n    <div style=\"width:min(720px,100%);margin:0 auto;background:#fff;border:1px solid oklch(0.88 0.006 258);border-radius:8px;padding:28px 32px;display:flex;flex-direction:column;gap:16px;font-size:16px;line-height:1.5\">\n      <h1 style=\"margin:0;font-size:22px;line-height:1.3\">Science Grade 7: Natural Selection and Adaptations<\u002Fh1>\n      <h2 style=\"margin:6px 0 0;font-size:16px;color:oklch(0.50 0.17 258)\">What you'll do<\u002Fh2>\n      <p style=\"margin:0\">You will answer 10 questions about two places in Montana. In Part 1, you will look at 30 years of data about bighorn sheep and figure out why the rams' horns are getting smaller. In Part 2, you will look at dinosaur nests found near Choteau and figure out what those dinosaurs are related to today.<\u002Fp>\n      <p style=\"margin:0\">You will not write any answers. You will choose answers, put cards in order, fill in a table, and use charts and tables to find evidence.<\u002Fp>\n      <h2 style=\"margin:6px 0 0;font-size:16px;color:oklch(0.50 0.17 258)\">About how long<\u002Fh2>\n      <p style=\"margin:0\">One class period, about 45 minutes. You can go back to any question until you end the test.<\u002Fp>\n      <h2 style=\"margin:6px 0 0;font-size:16px;color:oklch(0.50 0.17 258)\">Tools you have<\u002Fh2>\n      <p style=\"margin:0\">The play button reads each question to you. The Toolbox has a highlighter, a striker, a guideline, a mask, notes, and magnification. You can flag a question to come back to it. There is no calculator on this test; the math is small enough to do by hand.<\u002Fp>\n      <div style=\"display:flex;justify-content:space-between;gap:10px;margin-top:8px\">\n        <button sc-camel-on-click=\"{{ toTests }}\" style=\"font-size:14px;font-weight:700;letter-spacing:.04em;padding:10px 18px;border:1.5px solid oklch(0.50 0.17 258);border-radius:4px;background:#fff;color:oklch(0.50 0.17 258);cursor:pointer\">GO BACK<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ begin }}\" style=\"font-size:15px;font-weight:700;letter-spacing:.06em;padding:10px 28px;border:0;border-radius:4px;background:oklch(0.52 0.15 150);color:#fff;cursor:pointer\">BEGIN<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ inTest }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;align-items:center;gap:12px;padding:6px 14px;border-bottom:1px solid oklch(0.88 0.006 258);background:#fff;flex:none;flex-wrap:wrap\">\n    <button sc-camel-on-click=\"{{ tools.toggle }}\" aria-expanded=\"{{ tools.open }}\" style=\"display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:6px 10px;border:1px solid oklch(0.82 0.07 258);border-radius:4px;background:{{ tools.btnBg }};color:oklch(0.50 0.17 258);cursor:pointer\"><span aria-hidden=\"true\">▦<\u002Fspan>Toolbox<\u002Fbutton>\n    <div style=\"width:1px;height:28px;background:oklch(0.88 0.006 258)\"><\u002Fdiv>\n    <div role=\"group\" aria-label=\"Questions\" style=\"display:flex;gap:6px;flex-wrap:wrap\">\n      <sc-for list=\"{{ nav }}\" as=\"q\" hint-placeholder-count=\"10\">\n        <button sc-camel-on-click=\"{{ q.onClick }}\" aria-label=\"{{ q.aria }}\" aria-current=\"{{ q.cur }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:0;cursor:pointer;color:inherit\">\n          <span style=\"width:30px;height:30px;display:grid;place-items:center;border:2px solid {{ q.bd }};border-radius:4px;background:#fff;font-weight:700;font-size:14px\">{{ q.n }}<\u002Fspan>\n          <span aria-hidden=\"true\" style=\"height:13px;font-size:12px;line-height:13px;color:{{ q.indColor }}\">{{ q.ind }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <span style=\"flex:1\"><\u002Fspan>\n    <button sc-camel-on-click=\"{{ toggleHelp }}\" aria-expanded=\"{{ helpOpen }}\" aria-label=\"Help\" style=\"width:32px;height:32px;border-radius:50%;border:2px solid oklch(0.50 0.17 258);background:{{ helpBg }};color:{{ helpFg }};font-weight:700;font-size:16px;cursor:pointer\">?<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ toggleFlag }}\" aria-pressed=\"{{ flagOn }}\" disabled=\"{{ flagDisabled }}\" style=\"display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:6px 10px;border:1px solid {{ flagBd }};border-radius:4px;background:{{ flagBg }};color:{{ flagFg }};cursor:pointer;opacity:{{ flagOp }}\"><span aria-hidden=\"true\">⚑<\u002Fspan>{{ flagLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ tools.open }}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"toolbar\" aria-label=\"Toolbox\" style=\"display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid oklch(0.88 0.006 258);background:oklch(0.975 0.004 258);flex:none;animation:fadein .15s\">\n      <sc-for list=\"{{ tools.list }}\" as=\"t\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{ t.onClick }}\" aria-pressed=\"{{ t.active }}\" style=\"display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 10px;border:1px solid {{ t.bd }};border-radius:4px;background:{{ t.bg }};color:oklch(0.22 0.01 258);cursor:pointer\">\n          <span aria-hidden=\"true\" style=\"display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:3px;background:{{ t.sw }};text-decoration:{{ t.deco }};font-size:12px;padding:0 3px\">{{ t.glyph }}<\u002Fspan>{{ t.label }}\n        <\u002Fbutton>\n      <\u002Fsc-for>\n      <span style=\"align-self:center;font-size:12px;color:oklch(0.48 0.015 258);margin-left:8px\">{{ tools.hint }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"flex:1;min-height:0;position:relative;display:flex;flex-direction:column;zoom:{{ zoom }}\" sc-camel-on-pointer-move=\"{{ contentMove }}\">\n\n    <sc-if value=\"{{ scr.a0 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Cluster A opener\" style=\"flex:1;overflow:auto;padding:28px 24px\">\n      <div style=\"width:min(720px,100%);margin:0 auto;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:oklch(0.48 0.015 258)\">PART 1 · BIGHORN SHEEP<\u002Fdiv>\n        <h1 data-tts=\"\" style=\"margin:0;font-size:30px;line-height:1.2;color:oklch(0.50 0.17 258)\">Why are the horns getting smaller?<\u002Fh1>\n        <p data-tts=\"\" style=\"margin:0;font-size:18px;line-height:1.5\">Bighorn sheep live on the steep, rocky slopes of western Montana. Male sheep, called rams, grow large, curved horns.<\u002Fp>\n        <div role=\"img\" aria-label=\"Video placeholder, 20 to 30 seconds. Rams on a rocky slope in fall. A wildlife biologist wraps a tape around a ram's horn and reads the length.\" style=\"aspect-ratio:16/9;border-radius:8px;border:1px solid oklch(0.88 0.006 258);background:repeating-linear-gradient(135deg,oklch(0.95 0.005 258) 0 10px,oklch(0.915 0.005 258) 10px 20px);display:grid;place-items:center\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:16px\">\n            <button sc-camel-on-click=\"{{ video.toggle }}\" aria-expanded=\"{{ video.open }}\" aria-label=\"Play video\" style=\"width:56px;height:56px;border-radius:50%;border:0;background:oklch(0.50 0.17 258);color:#fff;font-size:20px;cursor:pointer\">▶<\u002Fbutton>\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:oklch(0.45 0.015 258);max-width:460px;line-height:1.5\">VIDEO · 0:24 · Rams on a rocky slope in fall. A wildlife biologist wraps a tape around a ram's horn and reads the length. Captions and audio description required.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ video.open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:12px 14px;border:1px solid oklch(0.88 0.006 258);border-radius:6px;background:oklch(0.975 0.004 258);font-size:15px;line-height:1.5\"><b>Transcript.<\u002Fb> Fall on a rocky slope. Three rams stand on a ledge. Their horns curve back and around. Two rams lower their heads and crash horns; the sound echoes. A wildlife biologist kneels beside a captured ram, wraps a tape along the outside curve of one horn, and reads the length.<\u002Fdiv><\u002Fsc-if>\n        <p data-tts=\"\" style=\"margin:0;font-size:15px;color:oklch(0.48 0.015 258)\">Watch the video. Then click Next to start the questions.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ scr.b0 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Cluster B opener\" style=\"flex:1;overflow:auto;padding:28px 24px\">\n      <div style=\"width:min(720px,100%);margin:0 auto;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:oklch(0.48 0.015 258)\">PART 2 · EGG MOUNTAIN<\u002Fdiv>\n        <h1 data-tts=\"\" style=\"margin:0;font-size:30px;line-height:1.2;color:oklch(0.50 0.17 258)\">What nested here, and what is it related to today?<\u002Fh1>\n        <div role=\"img\" aria-label=\"Photo placeholder. A grassy hillside near Choteau, Montana. A dig site is marked with string. Layers of rock show in the cut bank.\" style=\"aspect-ratio:16/8;border-radius:8px;border:1px solid oklch(0.88 0.006 258);background:repeating-linear-gradient(135deg,oklch(0.95 0.005 258) 0 10px,oklch(0.915 0.005 258) 10px 20px);display:grid;place-items:center\"><span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:oklch(0.45 0.015 258);max-width:460px;text-align:center;line-height:1.5;padding:16px\">PHOTO · A grassy hillside near Choteau, Montana. A dig site marked with string. Layers of rock show in the cut bank.<\u002Fspan><\u002Fdiv>\n        <p data-tts=\"\" style=\"margin:0;font-size:18px;line-height:1.5\">On a hillside near Choteau, Montana, scientists found dinosaur nests, eggs, embryos, and young buried together in layers of rock. The dinosaur is Maiasaura, Montana's state fossil. An embryo is an animal before it hatches.<\u002Fp>\n        <p data-tts=\"\" style=\"margin:0;font-size:15px;color:oklch(0.48 0.015 258)\">Read this page. Then click Next to start the questions.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCluster }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:1;display:flex;min-height:0;position:relative\">\n\n      <sc-if value=\"{{ panes.showStim }}\" hint-placeholder-val=\"{{ true }}\">\n      <section aria-label=\"Stimulus\" style=\"flex:0 0 {{ panes.stimW }};min-width:0;overflow:auto;padding:16px 20px 56px;display:flex;flex-direction:column;gap:18px;background:#fff\">\n\n        <sc-if value=\"{{ stim.A }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:sticky;top:-16px;margin:-16px -20px 0;padding:14px 20px 12px;background:#fff;border-bottom:1px solid oklch(0.88 0.006 258);z-index:2\">\n            <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;color:oklch(0.48 0.015 258)\">PART 1 · THE QUESTION<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;color:oklch(0.50 0.17 258);line-height:1.25\">Why are the horns getting smaller?<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <p style=\"margin:0;font-size:16px;line-height:1.5\">Bighorn sheep live on the steep, rocky slopes of western Montana. Male sheep, called rams, grow large, curved horns.<\u002Fp>\n            <button sc-camel-on-click=\"{{ video.toggle }}\" aria-expanded=\"{{ video.open }}\" style=\"align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 10px;border:1px solid oklch(0.88 0.006 258);border-radius:4px;background:oklch(0.975 0.004 258);color:oklch(0.50 0.17 258);cursor:pointer\"><span aria-hidden=\"true\">▶<\u002Fspan>Video: Rams on the slope (0:24) · {{ video.label }}<\u002Fbutton>\n            <sc-if value=\"{{ video.open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:10px 12px;border:1px solid oklch(0.88 0.006 258);border-radius:6px;background:oklch(0.975 0.004 258);font-size:14px;line-height:1.5\"><b>Transcript.<\u002Fb> Fall on a rocky slope. Three rams stand on a ledge. Their horns curve back and around. Two rams lower their heads and crash horns. A wildlife biologist kneels beside a captured ram, wraps a tape along the outside curve of one horn, and reads the length.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ piece.a1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid oklch(0.88 0.006 258)\">\n            <sc-if value=\"{{ new.a1 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:oklch(0.955 0.025 258);color:oklch(0.50 0.17 258)\">NEW FOR THIS QUESTION<\u002Fspan><\u002Fsc-if>\n            <div role=\"img\" aria-label=\"Photo placeholder. A 4-year-old bighorn ram in profile, showing the curve of its horns.\" style=\"height:110px;border-radius:8px;border:1px solid oklch(0.88 0.006 258);background:repeating-linear-gradient(135deg,oklch(0.95 0.005 258) 0 10px,oklch(0.915 0.005 258) 10px 20px);display:grid;place-items:center\"><span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:oklch(0.45 0.015 258);text-align:center;padding:0 16px\">PHOTO · A 4-year-old ram, side view, showing the horn curve<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.5\">For 30 years, wildlife biologists measured the horns of 4-year-old rams in one herd. Figure 1 shows the average horn length each year.<\u002Fp>\n            <figure style=\"margin:0;border:1px solid oklch(0.88 0.006 258);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fff\">\n              <figcaption style=\"font-weight:700;font-size:15px\">Figure 1. Average horn length of 4-year-old rams, 1990 to 2020<\u002Ffigcaption>\n              <div style=\"display:flex;gap:6px;align-items:stretch\">\n                <div aria-hidden=\"true\" style=\"display:flex;flex-direction:column;justify-content:space-between;font-size:11px;line-height:12px;color:oklch(0.48 0.015 258);text-align:right;width:34px;flex:none\">\n                  <span>75 cm<\u002Fspan><span>70<\u002Fspan><span>65<\u002Fspan><span>60<\u002Fspan><span>55<\u002Fspan><span>50<\u002Fspan>\n                <\u002Fdiv>\n                <div ref=\"{{ chartRef }}\" style=\"flex:1;min-width:0;position:relative;height:200px;touch-action:none\">\n                  <svg width=\"{{ ch.w }}\" height=\"200\" role=\"img\" aria-label=\"Line chart. Average horn length of 4-year-old rams fell from about 70 centimeters in 1990 to about 56 centimeters in 2020, with small ups and downs along the way.\" style=\"display:block;cursor:crosshair;overflow:visible\" sc-camel-on-pointer-down=\"{{ ch.onDown }}\" sc-camel-on-pointer-move=\"{{ ch.onMove }}\" sc-camel-on-pointer-up=\"{{ ch.onUp }}\" sc-camel-on-pointer-leave=\"{{ ch.onLeave }}\">\n                    <line x1=\"0\" x2=\"{{ ch.w }}\" y1=\"{{ ch.gy75 }}\" y2=\"{{ ch.gy75 }}\" style=\"stroke:oklch(0.9 0.005 258);stroke-width:1\"><\u002Fline>\n                    <line x1=\"0\" x2=\"{{ ch.w }}\" y1=\"{{ ch.gy70 }}\" y2=\"{{ ch.gy70 }}\" style=\"stroke:oklch(0.9 0.005 258);stroke-width:1\"><\u002Fline>\n                    <line x1=\"0\" x2=\"{{ ch.w }}\" y1=\"{{ ch.gy65 }}\" y2=\"{{ ch.gy65 }}\" style=\"stroke:oklch(0.9 0.005 258);stroke-width:1\"><\u002Fline>\n                    <line x1=\"0\" x2=\"{{ ch.w }}\" y1=\"{{ ch.gy60 }}\" y2=\"{{ ch.gy60 }}\" style=\"stroke:oklch(0.9 0.005 258);stroke-width:1\"><\u002Fline>\n                    <line x1=\"0\" x2=\"{{ ch.w }}\" y1=\"{{ ch.gy55 }}\" y2=\"{{ ch.gy55 }}\" style=\"stroke:oklch(0.9 0.005 258);stroke-width:1\"><\u002Fline>\n                    <line x1=\"0\" x2=\"{{ ch.w }}\" y1=\"{{ ch.gy50 }}\" y2=\"{{ ch.gy50 }}\" style=\"stroke:oklch(0.8 0.005 258);stroke-width:1\"><\u002Fline>\n                    <rect x=\"{{ ch.rangeX }}\" y=\"0\" width=\"{{ ch.rangeW }}\" height=\"200\" style=\"fill:oklch(0.50 0.17 258);opacity:.10\"><\u002Frect>\n                    <polyline points=\"{{ ch.pts }}\" style=\"fill:none;stroke:oklch(0.50 0.17 258);stroke-width:2.5;stroke-linejoin:round\"><\u002Fpolyline>\n                    <line x1=\"{{ ch.hoverX }}\" x2=\"{{ ch.hoverX }}\" y1=\"0\" y2=\"200\" style=\"stroke:oklch(0.22 0.01 258);stroke-width:1;stroke-dasharray:3 3;opacity:{{ ch.hoverOp }}\"><\u002Fline>\n                    <circle cx=\"{{ ch.fromX }}\" cy=\"{{ ch.fromY }}\" r=\"5\" style=\"fill:#fff;stroke:oklch(0.50 0.17 258);stroke-width:2.5\"><\u002Fcircle>\n                    <circle cx=\"{{ ch.toX }}\" cy=\"{{ ch.toY }}\" r=\"5\" style=\"fill:oklch(0.50 0.17 258);stroke:#fff;stroke-width:2\"><\u002Fcircle>\n                  <\u002Fsvg>\n                  <div aria-hidden=\"true\" style=\"position:absolute;top:4px;left:{{ ch.tipLeft }};transform:translateX(-50%);background:oklch(0.22 0.01 258);color:#fff;font-size:12px;padding:3px 7px;border-radius:4px;pointer-events:none;white-space:nowrap;opacity:{{ ch.hoverOp }}\">{{ ch.hoverLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div aria-hidden=\"true\" style=\"display:flex;justify-content:space-between;font-size:11px;color:oklch(0.48 0.015 258);margin-left:40px\"><span>1990<\u002Fspan><span>2000<\u002Fspan><span>2010<\u002Fspan><span>2020<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px\">\n                <label style=\"display:flex;align-items:center;gap:8px\">From year<input type=\"range\" min=\"1990\" max=\"2020\" value=\"{{ ch.from }}\" sc-camel-on-change=\"{{ ch.onFrom }}\" style=\"width:110px;accent-color:oklch(0.50 0.17 258)\"><b style=\"min-width:36px\">{{ ch.from }}<\u002Fb><\u002Flabel>\n                <label style=\"display:flex;align-items:center;gap:8px\">To year<input type=\"range\" min=\"1990\" max=\"2020\" value=\"{{ ch.to }}\" sc-camel-on-change=\"{{ ch.onTo }}\" style=\"width:110px;accent-color:oklch(0.50 0.17 258)\"><b style=\"min-width:36px\">{{ ch.to }}<\u002Fb><\u002Flabel>\n              <\u002Fdiv>\n              <div role=\"status\" style=\"padding:8px 10px;background:oklch(0.955 0.025 258);border-radius:6px;font-size:15px;line-height:1.4\">{{ ch.compare }}<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ ch.toggleText }}\" aria-expanded=\"{{ ch.textOpen }}\" style=\"align-self:flex-start;font-size:13px;font-weight:600;padding:4px 0;border:0;background:none;color:oklch(0.50 0.17 258);cursor:pointer;text-decoration:underline\">{{ ch.textLabel }}<\u002Fbutton>\n              <sc-if value=\"{{ ch.textOpen }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:14px;line-height:1.5;padding:8px 10px;background:oklch(0.975 0.004 258);border-radius:6px\">Text version. The line starts near 70 cm in 1990. It goes down a little most years, with small ups and downs. It passes 65 cm around 2000, 60 cm around 2010, and ends near 56 cm in 2020. Overall, average horn length fell about 14 cm in 30 years.<\u002Fp><\u002Fsc-if>\n              <p style=\"margin:0;font-size:12px;color:oklch(0.48 0.015 258);line-height:1.4\">Drag across the chart, or move the sliders, to compare two years. Illustrative data for design review; not real measurements.<\u002Fp>\n            <\u002Ffigure>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ piece.a2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid oklch(0.88 0.006 258)\">\n            <sc-if value=\"{{ new.a2 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:oklch(0.955 0.025 258);color:oklch(0.50 0.17 258)\">NEW FOR THIS QUESTION<\u002Fspan><\u002Fsc-if>\n            <p style=\"margin:0;font-size:16px;line-height:1.5\"><b>Harvest<\u002Fb> means a hunter legally takes a ram. Hunters could harvest a ram once its horns reached a legal size. Most legal rams were harvested at age 4 or 5. A ram's best breeding years are ages 6 to 9.<\u002Fp>\n            <p style=\"margin:0;font-size:16px;line-height:1.5\">Rams with the largest horns usually win fights with other rams, and the winners father the most lambs. Horn size is strongly <b>inherited<\u002Fb>: large-horned fathers tend to have large-horned sons.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"font-weight:700;font-size:15px\">Table 1. Rams grouped by horn size at age 4<\u002Fdiv>\n              <div role=\"table\" aria-label=\"Table 1. Rams grouped by horn size at age 4\" style=\"border:1px solid oklch(0.88 0.006 258);border-radius:8px;overflow:hidden;font-size:15px\">\n                <div role=\"row\" style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr;background:oklch(0.975 0.004 258);font-weight:700\">\n                  <div role=\"columnheader\" style=\"padding:8px 10px\">Horn size at age 4<\u002Fdiv>\n                  <button role=\"columnheader\" aria-sort=\"{{ t1.ariaHarv }}\" sc-camel-on-click=\"{{ t1.sortHarv }}\" style=\"text-align:left;background:none;border:0;border-left:1px solid oklch(0.88 0.006 258);padding:8px 10px;font:inherit;font-weight:700;cursor:pointer;color:oklch(0.50 0.17 258);text-decoration:underline\">Harvested before age 6{{ t1.harvArrow }}<\u002Fbutton>\n                  <button role=\"columnheader\" aria-sort=\"{{ t1.ariaLamb }}\" sc-camel-on-click=\"{{ t1.sortLamb }}\" style=\"text-align:left;background:none;border:0;border-left:1px solid oklch(0.88 0.006 258);padding:8px 10px;font:inherit;font-weight:700;cursor:pointer;color:oklch(0.50 0.17 258);text-decoration:underline\">Lambs fathered by age 8 (rams that survived){{ t1.lambArrow }}<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-for list=\"{{ t1.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <button role=\"row\" aria-pressed=\"{{ r.hl }}\" aria-label=\"{{ r.aria }}\" sc-camel-on-click=\"{{ r.onClick }}\" style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr;width:100%;text-align:left;background:{{ r.bg }};border:0;border-top:1px solid oklch(0.88 0.006 258);padding:0;font:inherit;cursor:pointer;color:inherit\">\n                    <span role=\"cell\" style=\"display:block;padding:9px 10px;font-weight:600\">{{ r.size }}<\u002Fspan><span role=\"cell\" style=\"display:block;padding:9px 10px;border-left:1px solid oklch(0.88 0.006 258)\">{{ r.harvested }}<\u002Fspan><span role=\"cell\" style=\"display:block;padding:9px 10px;border-left:1px solid oklch(0.88 0.006 258)\">{{ r.lambs }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:12px;color:oklch(0.48 0.015 258);line-height:1.4\">Click a heading to sort. Click a row to highlight it. {{ t1.sortNote }} Illustrative data for design review; not real measurements.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ piece.a6 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid oklch(0.88 0.006 258)\">\n            <sc-if value=\"{{ new.a6 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:oklch(0.955 0.025 258);color:oklch(0.50 0.17 258)\">NEW FOR THIS QUESTION<\u002Fspan><\u002Fsc-if>\n            <div style=\"border:2px dashed oklch(0.86 0.07 80);border-radius:8px;padding:14px;background:oklch(0.975 0.025 80);display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.42 0.10 70)\">SOURCE PANEL · INDIAN EDUCATION FOR ALL<\u002Fspan>\n              <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;color:oklch(0.42 0.10 70)\">Source to be developed with OPI's Indian Education for All staff and tribal partners.<\u002Fspan>\n              <span style=\"font-size:13px;color:oklch(0.48 0.015 258);line-height:1.4\">A tribal wildlife-management perspective on bighorn harvest will sit here, beside the three rules. Placeholder only; no content is drafted.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ stim.B }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:sticky;top:-16px;margin:-16px -20px 0;padding:14px 20px 12px;background:#fff;border-bottom:1px solid oklch(0.88 0.006 258);z-index:2\">\n            <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;color:oklch(0.48 0.015 258)\">PART 2 · THE QUESTION<\u002Fdiv>\n            <div style=\"font-size:20px;font-weight:700;color:oklch(0.50 0.17 258);line-height:1.25\">What nested here, and what is it related to today?<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div role=\"img\" aria-label=\"Photo placeholder. A grassy hillside near Choteau, Montana, with a dig site and layered rock in the cut bank.\" style=\"height:90px;border-radius:8px;border:1px solid oklch(0.88 0.006 258);background:repeating-linear-gradient(135deg,oklch(0.95 0.005 258) 0 10px,oklch(0.915 0.005 258) 10px 20px);display:grid;place-items:center\"><span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:oklch(0.45 0.015 258);text-align:center;padding:0 16px\">PHOTO · Hillside near Choteau with the dig site and layered rock<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.5\">On a hillside near Choteau, Montana, scientists found dinosaur nests, eggs, embryos, and young buried together in layers of rock. The dinosaur is Maiasaura, Montana's state fossil. An <b>embryo<\u002Fb> is an animal before it hatches.<\u002Fp>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ piece.b1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid oklch(0.88 0.006 258)\">\n            <sc-if value=\"{{ new.b1 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:oklch(0.955 0.025 258);color:oklch(0.50 0.17 258)\">NEW FOR THIS QUESTION<\u002Fspan><\u002Fsc-if>\n            <p style=\"margin:0;font-size:16px;line-height:1.5\">Rock layers form one on top of another. In layers that have not been flipped, the lowest layer formed first.<\u002Fp>\n            <div style=\"font-weight:700;font-size:15px\">Figure 2. Rock layers at the site, top to bottom<\u002Fdiv>\n            <div role=\"list\" aria-label=\"Rock layers, top to bottom. Tap a layer to see what was found in it.\" style=\"display:flex;flex-direction:column;border:1px solid oklch(0.88 0.006 258);border-radius:8px;overflow:hidden\">\n              <sc-for list=\"{{ rock.layers }}\" as=\"L\" hint-placeholder-count=\"5\">\n                <button role=\"listitem\" aria-expanded=\"{{ L.open }}\" sc-camel-on-click=\"{{ L.onClick }}\" style=\"display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;padding:10px 12px;background:{{ L.color }};border:0;border-bottom:1px solid #fff;font:inherit;cursor:pointer;color:oklch(0.22 0.01 258);min-height:50px\">\n                  <span style=\"display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700\"><span>{{ L.name }}<\u002Fspan><span style=\"font-weight:400;font-size:12px;color:oklch(0.35 0.01 258)\">{{ L.tap }}<\u002Fspan><\u002Fspan>\n                  <sc-if value=\"{{ L.open }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:block;background:#fff;padding:6px 8px;border-radius:4px;font-size:14px;animation:fadein .15s\">Found here: <b>{{ L.find }}<\u002Fb><\u002Fspan><\u002Fsc-if>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:12px;color:oklch(0.48 0.015 258);line-height:1.4\">Illustrative rock column for design review; not a real section.<\u002Fp>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ piece.b2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid oklch(0.88 0.006 258)\">\n            <sc-if value=\"{{ new.b2 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:oklch(0.955 0.025 258);color:oklch(0.50 0.17 258)\">NEW FOR THIS QUESTION<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ new.b3 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:oklch(0.955 0.025 258);color:oklch(0.50 0.17 258)\">NEW FOR THIS QUESTION: EMBRYO AND YOUNG VIEW<\u002Fspan><\u002Fsc-if>\n            <p style=\"margin:0;font-size:16px;line-height:1.5\">Scientists compare bones to figure out how animals are related. <b>Modern<\u002Fb> means living today. Click each animal to compare its bones.<\u002Fp>\n            <sc-if value=\"{{ piece.b3 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:16px;line-height:1.5\">Some clues to relationships show up only in embryos and young animals, before the bones finish growing.<\u002Fp><\u002Fsc-if>\n            <div style=\"border:1px solid oklch(0.88 0.006 258);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-weight:700;font-size:15px\">Bone comparison<\u002Fdiv>\n              <div role=\"tablist\" aria-label=\"Animal\" style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <sc-for list=\"{{ bones.animals }}\" as=\"an\" hint-placeholder-count=\"3\"><button role=\"tab\" aria-selected=\"{{ an.active }}\" sc-camel-on-click=\"{{ an.onClick }}\" style=\"padding:6px 12px;border-radius:999px;border:1.5px solid {{ an.bd }};background:{{ an.bg }};color:{{ an.fg }};font:inherit;font-size:14px;font-weight:600;cursor:pointer\">{{ an.label }}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ bones.hasStage }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;gap:6px;align-items:center;font-size:14px;flex-wrap:wrap\"><span style=\"color:oklch(0.48 0.015 258)\">View:<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ bones.setAdult }}\" aria-pressed=\"{{ bones.stageAdult }}\" style=\"padding:5px 10px;border-radius:4px;border:1px solid oklch(0.82 0.07 258);background:{{ bones.adultBg }};color:oklch(0.22 0.01 258);font:inherit;font-size:13px;font-weight:600;cursor:pointer\">Adult skeleton<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ bones.setEmbryo }}\" aria-pressed=\"{{ bones.stageEmbryo }}\" style=\"padding:5px 10px;border-radius:4px;border:1px solid oklch(0.82 0.07 258);background:{{ bones.embryoBg }};color:oklch(0.22 0.01 258);font:inherit;font-size:13px;font-weight:600;cursor:pointer\">Embryo and young<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div role=\"img\" aria-label=\"{{ bones.diagramLabel }}\" style=\"height:120px;border-radius:6px;border:1px solid oklch(0.88 0.006 258);background:repeating-linear-gradient(135deg,oklch(0.95 0.005 258) 0 10px,oklch(0.915 0.005 258) 10px 20px);display:grid;place-items:center\"><span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:oklch(0.45 0.015 258);text-align:center;padding:0 16px;line-height:1.5\">{{ bones.diagramLabel }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-weight:600;font-size:14px\">{{ bones.title }}<\u002Fdiv>\n              <div role=\"list\" style=\"display:flex;flex-direction:column;gap:4px;font-size:15px\">\n                <sc-for list=\"{{ bones.features }}\" as=\"f\" hint-placeholder-count=\"4\"><div role=\"listitem\" style=\"display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:4px;background:{{ f.bg }}\"><span>{{ f.text }}<\u002Fspan><span style=\"font-weight:700;color:{{ f.fg }};white-space:nowrap\">{{ f.label }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:12px;color:oklch(0.48 0.015 258);line-height:1.4\">Illustrative comparison for design review. Features to be checked by OPI's content lead.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ piece.b4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid oklch(0.88 0.006 258)\">\n            <sc-if value=\"{{ new.b4 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:oklch(0.955 0.025 258);color:oklch(0.50 0.17 258)\">NEW FOR THIS QUESTION<\u002Fspan><\u002Fsc-if>\n            <div style=\"font-weight:700;font-size:15px\">Table 2. Adult skeleton features, side by side<\u002Fdiv>\n            <sc-raw-table style=\"border-collapse:collapse;width:100%;font-size:14px;border:1px solid oklch(0.88 0.006 258)\">\n              <sc-raw-thead>\n                <sc-raw-tr style=\"background:oklch(0.975 0.004 258)\"><sc-raw-th style=\"text-align:left;padding:8px 10px;border-bottom:1px solid oklch(0.88 0.006 258)\">Feature<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px 6px;border-bottom:1px solid oklch(0.88 0.006 258);border-left:1px solid oklch(0.88 0.006 258)\">Maiasaura<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px 6px;border-bottom:1px solid oklch(0.88 0.006 258);border-left:1px solid oklch(0.88 0.006 258)\">Modern bird<\u002Fsc-raw-th><sc-raw-th style=\"padding:8px 6px;border-bottom:1px solid oklch(0.88 0.006 258);border-left:1px solid oklch(0.88 0.006 258)\">Modern crocodilian<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-th scope=\"row\" style=\"text-align:left;padding:8px 10px;font-weight:600\">1. Hip socket is an open hole through the bone<\u002Fsc-raw-th><sc-raw-td style=\"text-align:center;padding:8px 6px;border-left:1px solid oklch(0.88 0.006 258)\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"text-align:center;padding:8px 6px;border-left:1px solid oklch(0.88 0.006 258)\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"text-align:center;padding:8px 6px;border-left:1px solid oklch(0.88 0.006 258)\">No<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr style=\"background:oklch(0.985 0.002 258)\"><sc-raw-th scope=\"row\" style=\"text-align:left;padding:8px 10px;font-weight:600\">2. Legs held straight under the body<\u002Fsc-raw-th><sc-raw-td style=\"text-align:center;padding:8px 6px;border-left:1px solid oklch(0.88 0.006 258)\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"text-align:center;padding:8px 6px;border-left:1px solid oklch(0.88 0.006 258)\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"text-align:center;padding:8px 6px;border-left:1px solid oklch(0.88 0.006 258)\">No<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-th scope=\"row\" style=\"text-align:left;padding:8px 10px;font-weight:600\">3. Backbone made of many separate bones<\u002Fsc-raw-th><sc-raw-td style=\"text-align:center;padding:8px 6px;border-left:1px solid oklch(0.88 0.006 258)\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"text-align:center;padding:8px 6px;border-left:1px solid oklch(0.88 0.006 258)\">Yes<\u002Fsc-raw-td><sc-raw-td style=\"text-align:center;padding:8px 6px;border-left:1px solid oklch(0.88 0.006 258)\">Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc
