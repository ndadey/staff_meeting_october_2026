px;font-weight:700;color:oklch(0.62 0.01 258)\">{{ o.tag }}<\u002Fspan><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ show.a6 }}\" hint-placeholder-val=\"{{ false }}\">\n        <article data-screen-label=\"A6\" style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:oklch(0.48 0.015 258)\">QUESTION 6<\u002Fdiv>\n          <p data-tts=\"\" style=\"margin:0;font-size:14px;color:oklch(0.48 0.015 258);font-style:italic\">For this question, you will make a prediction, then run a model to check it.<\u002Fp>\n          <p data-tts=\"\" style=\"margin:0;font-size:17px;line-height:1.5\">Wildlife managers want to slow the decrease in horn size. Three harvest rules are on the table. Predict which rule would slow the change. Choose a rule, then lock in your prediction. After that, you can run the model to see what it predicts for the next 10 generations.<\u002Fp>\n          <div role=\"radiogroup\" aria-label=\"Harvest rules\" style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ a6.rules }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button role=\"radio\" aria-checked=\"{{ o.sel }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:flex;align-items:flex-start;gap:12px;text-align:left;padding:10px 12px;border-radius:6px;border:1.5px solid {{ o.bd }};background:{{ o.bg }};cursor:{{ o.cur }};font-size:16px;line-height:1.4;color:inherit\"><span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;border-radius:50%;border:2px solid {{ o.dotBd }};background:{{ o.dotBg }};margin-top:2px;box-shadow:inset 0 0 0 3px #fff\"><\u002Fspan><span data-tts=\"\" style=\"flex:1;text-decoration:{{ o.deco }};background:{{ o.hl }}\">{{ o.text }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ a6.lock }}\" disabled=\"{{ a6.lockDisabled }}\" style=\"font-size:14px;font-weight:700;letter-spacing:.02em;padding:9px 16px;border:1.5px solid oklch(0.50 0.17 258);border-radius:4px;background:oklch(0.50 0.17 258);color:#fff;cursor:pointer;opacity:{{ a6.lockOp }}\">{{ a6.lockLabel }}<\u002Fbutton>\n            <span role=\"status\" style=\"font-size:14px;color:oklch(0.48 0.015 258)\">{{ a6.lockNote }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid oklch(0.88 0.006 258);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;background:oklch(0.975 0.004 258)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\">\n              <span style=\"font-weight:700;font-size:15px\">Model: average horn length over 10 generations<\u002Fspan>\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:#fff;border:1px solid oklch(0.88 0.006 258);color:oklch(0.48 0.015 258)\">THIS IS A MODEL<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:14px;color:oklch(0.48 0.015 258);line-height:1.4\">The model uses made-up numbers to show the pattern each rule would cause. A generation is about 6 years. It runs only for the rule you locked in.<\u002Fp>\n            <button sc-camel-on-click=\"{{ a6.run }}\" disabled=\"{{ a6.runDisabled }}\" style=\"align-self:flex-start;font-size:14px;font-weight:700;padding:9px 16px;border:0;border-radius:4px;background:oklch(0.52 0.15 150);color:#fff;cursor:pointer;opacity:{{ a6.runOp }}\">{{ a6.runLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ a6.showChart }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid oklch(0.88 0.006 258);border-radius:6px;padding:10px 12px\">\n                <div style=\"font-size:13px;font-weight:700\">{{ a6.seriesLabel }}<\u002Fdiv>\n                <div role=\"img\" aria-label=\"{{ a6.chartAria }}\" style=\"display:flex;align-items:flex-end;gap:5px;height:112px;border-bottom:1px solid oklch(0.7 0.01 258)\">\n                  <sc-for list=\"{{ a6.bars }}\" as=\"b\" hint-placeholder-count=\"11\">\n                    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%\"><span style=\"font-size:10px;color:oklch(0.48 0.015 258);line-height:1\">{{ b.label }}<\u002Fspan><div style=\"width:100%;height:{{ b.h }};background:{{ b.color }};border-radius:3px 3px 0 0;transition:height .25s\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div aria-hidden=\"true\" style=\"display:flex;gap:5px\"><sc-for list=\"{{ a6.gens }}\" as=\"g\" hint-placeholder-count=\"11\"><span style=\"flex:1;text-align:center;font-size:10px;color:oklch(0.48 0.015 258)\">{{ g.n }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <div style=\"font-size:11px;color:oklch(0.48 0.015 258)\">Generation · bar labels show average horn length in cm<\u002Fdiv>\n                <sc-if value=\"{{ a6.showRef }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:13px;font-weight:700;margin-top:8px\">For comparison: Rule A, the current rule<\u002Fdiv>\n                  <div role=\"img\" aria-label=\"Bar chart for comparison. Under the current rule, average horn length keeps falling from 56 to about 46 centimeters over 10 generations.\" style=\"display:flex;align-items:flex-end;gap:5px;height:112px;border-bottom:1px solid oklch(0.7 0.01 258)\">\n                    <sc-for list=\"{{ a6.refBars }}\" as=\"b\" hint-placeholder-count=\"11\">\n                      <div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%\"><span style=\"font-size:10px;color:oklch(0.48 0.015 258);line-height:1\">{{ b.label }}<\u002Fspan><div style=\"width:100%;height:{{ b.h }};background:{{ b.color }};border-radius:3px 3px 0 0;transition:height .25s\"><\u002Fdiv><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ a6.showResult }}\" hint-placeholder-val=\"{{ false }}\"><p role=\"status\" style=\"margin:0;padding:10px 12px;background:#fff;border:1px solid oklch(0.82 0.07 258);border-radius:6px;font-size:15px;line-height:1.5\">{{ a6.result }}<\u002Fp><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ show.b1 }}\" hint-placeholder-val=\"{{ false }}\">\n        <article data-screen-label=\"B1\" style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:oklch(0.48 0.015 258)\">QUESTION 7<\u002Fdiv>\n          <p data-tts=\"\" style=\"margin:0;font-size:14px;color:oklch(0.48 0.015 258);font-style:italic\">For this question, you will use the rock layers to choose one answer.<\u002Fp>\n          <p data-tts=\"\" style=\"margin:0;font-size:17px;line-height:1.5\">Tap each rock layer in Figure 2 to see what was found in it. Which list puts the three fossils in order from oldest to youngest?<\u002Fp>\n          <div role=\"radiogroup\" aria-label=\"Answer choices\" style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ b1opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button role=\"radio\" aria-checked=\"{{ o.sel }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:flex;align-items:flex-start;gap:12px;text-align:left;padding:10px 12px;border-radius:6px;border:1.5px solid {{ o.bd }};background:{{ o.bg }};cursor:{{ o.cur }};font-size:16px;line-height:1.4;color:inherit\"><span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;border-radius:50%;border:2px solid {{ o.dotBd }};background:{{ o.dotBg }};margin-top:2px;box-shadow:inset 0 0 0 3px #fff\"><\u002Fspan><span data-tts=\"\" style=\"flex:1;text-decoration:{{ o.deco }};background:{{ o.hl }}\">{{ o.text }}<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none;font-size:11px;font-weight:700;color:oklch(0.62 0.01 258)\">{{ o.tag }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ show.b2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <article data-screen-label=\"B2\" style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:oklch(0.48 0.015 258)\">QUESTION 8<\u002Fdiv>\n          <p data-tts=\"\" style=\"margin:0;font-size:14px;color:oklch(0.48 0.015 258);font-style:italic\">For this question, you will use the bone comparison to choose one answer.<\u002Fp>\n          <p data-tts=\"\" style=\"margin:0;font-size:17px;line-height:1.5\">Click each animal in the bone comparison. Maiasaura's hip socket is an open hole through the bone. Modern birds have the same kind of hip socket. Modern crocodilians do not. What is the best explanation for why Maiasaura and birds share this structure?<\u002Fp>\n          <div role=\"radiogroup\" aria-label=\"Answer choices\" style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ b2opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <button role=\"radio\" aria-checked=\"{{ o.sel }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:flex;align-items:flex-start;gap:12px;text-align:left;padding:10px 12px;border-radius:6px;border:1.5px solid {{ o.bd }};background:{{ o.bg }};cursor:{{ o.cur }};font-size:16px;line-height:1.4;color:inherit\"><span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;border-radius:50%;border:2px solid {{ o.dotBd }};background:{{ o.dotBg }};margin-top:2px;box-shadow:inset 0 0 0 3px #fff\"><\u002Fspan><span data-tts=\"\" style=\"flex:1;text-decoration:{{ o.deco }};background:{{ o.hl }}\">{{ o.text }}<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none;font-size:11px;font-weight:700;color:oklch(0.62 0.01 258)\">{{ o.tag }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ show.b3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <article data-screen-label=\"B3\" style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:oklch(0.48 0.015 258)\">QUESTION 9<\u002Fdiv>\n          <p data-tts=\"\" style=\"margin:0;font-size:14px;color:oklch(0.48 0.015 258);font-style:italic\">For this question, you will fill in a table.<\u002Fp>\n          <p data-tts=\"\" style=\"margin:0;font-size:17px;line-height:1.5\">Switch the bone comparison to Embryo and young. Click each animal. For each feature of the Maiasaura embryo or young, choose what it is evidence for. Choose one box in each row.<\u002Fp>\n          <div role=\"table\" aria-label=\"Classify each feature\" style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;border:1px solid oklch(0.88 0.006 258);border-radius:8px;overflow:hidden;font-size:14px\">\n            <div role=\"columnheader\" style=\"padding:10px;background:oklch(0.975 0.004 258);font-weight:700;display:flex;align-items:center\">Feature of the Maiasaura embryo or young<\u002Fdiv>\n            <div role=\"columnheader\" style=\"padding:10px;background:oklch(0.975 0.004 258);font-weight:700;border-left:1px solid oklch(0.88 0.006 258);text-align:center;display:flex;align-items:center;justify-content:center\">Evidence Maiasaura is closer to birds<\u002Fdiv>\n            <div role=\"columnheader\" style=\"padding:10px;background:oklch(0.975 0.004 258);font-weight:700;border-left:1px solid oklch(0.88 0.006 258);text-align:center;display:flex;align-items:center;justify-content:center\">Evidence Maiasaura is closer to crocodilians<\u002Fdiv>\n            <div role=\"columnheader\" style=\"padding:10px;background:oklch(0.975 0.004 258);font-weight:700;border-left:1px solid oklch(0.88 0.006 258);text-align:center;display:flex;align-items:center;justify-content:center\">Not evidence either way (shared by both)<\u002Fdiv>\n            <sc-for list=\"{{ b3rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div role=\"rowheader\" style=\"padding:10px;border-top:1px solid oklch(0.88 0.006 258);font-weight:600;display:flex;align-items:center;line-height:1.35\">{{ r.text }}<\u002Fdiv>\n              <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <button role=\"radio\" aria-checked=\"{{ c.sel }}\" aria-label=\"{{ c.aria }}\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"border:0;border-top:1px solid oklch(0.88 0.006 258);border-left:1px solid oklch(0.88 0.006 258);background:{{ c.bg }};cursor:pointer;display:grid;place-items:center;min-height:56px;padding:8px\"><span aria-hidden=\"true\" style=\"width:20px;height:20px;border-radius:50%;border:2px solid {{ c.dotBd }};background:{{ c.dotBg }};box-shadow:inset 0 0 0 3px #fff\"><\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p role=\"status\" style=\"margin:0;font-size:13px;color:oklch(0.48 0.015 258)\">{{ b3hint }}<\u002Fp>\n        <\u002Farticle>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ show.b4 }}\" hint-placeholder-val=\"{{ false }}\">\n        <article data-screen-label=\"B4\" style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:.08em;color:oklch(0.48 0.015 258)\">QUESTION 10<\u002Fdiv>\n          <p data-tts=\"\" style=\"margin:0;font-size:14px;color:oklch(0.48 0.015 258);font-style:italic\">For this question, you will choose two pieces of evidence, then a reason.<\u002Fp>\n          <p data-tts=\"\" style=\"margin:0;font-size:17px;line-height:1.5\">Is Maiasaura closer to modern birds or to modern crocodilians? Use Table 2.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.48 0.015 258)\">PART 1 OF 2<\u002Fspan><p data-tts=\"\" style=\"margin:0;font-size:16px;font-weight:600\">Select the TWO features that show Maiasaura is closer to birds.<\u002Fp><\u002Fdiv>\n            <div role=\"group\" aria-label=\"Features, choose two\" style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ b4.ev }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <button role=\"checkbox\" aria-checked=\"{{ o.sel }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:flex;align-items:flex-start;gap:12px;text-align:left;padding:10px 12px;border-radius:6px;border:1.5px solid {{ o.bd }};background:{{ o.bg }};cursor:{{ o.cur }};font-size:16px;line-height:1.4;color:inherit\"><span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;border-radius:4px;border:2px solid {{ o.dotBd }};background:{{ o.dotBg }};margin-top:2px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700\">{{ o.check }}<\u002Fspan><span data-tts=\"\" style=\"flex:1;text-decoration:{{ o.deco }};background:{{ o.hl }}\">{{ o.text }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p role=\"status\" style=\"margin:0;font-size:13px;color:oklch(0.48 0.015 258)\">{{ b4.evCount }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.48 0.015 258)\">PART 2 OF 2<\u002Fspan><p data-tts=\"\" style=\"margin:0;font-size:16px;font-weight:600\">Choose the reason a shared structure counts as evidence of a closer relationship.<\u002Fp><\u002Fdiv>\n            <div role=\"radiogroup\" aria-label=\"Reason choices\" style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ b4.re }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <button role=\"radio\" aria-checked=\"{{ o.sel }}\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:flex;align-items:flex-start;gap:12px;text-align:left;padding:10px 12px;border-radius:6px;border:1.5px solid {{ o.bd }};background:{{ o.bg }};cursor:{{ o.cur }};font-size:16px;line-height:1.4;color:inherit\"><span aria-hidden=\"true\" style=\"flex:none;width:20px;height:20px;border-radius:50%;border:2px solid {{ o.dotBd }};background:{{ o.dotBg }};margin-top:2px;box-shadow:inset 0 0 0 3px #fff\"><\u002Fspan><span data-tts=\"\" style=\"flex:1;text-decoration:{{ o.deco }};background:{{ o.hl }}\">{{ o.text }}<\u002Fspan><span aria-hidden=\"true\" style=\"flex:none;font-size:11px;font-weight:700;color:oklch(0.62 0.01 258)\">{{ o.tag }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <\u002Fsc-if>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid oklch(0.88 0.006 258);background:#fff;flex:none\">\n      <div style=\"display:flex\">\n        <button sc-camel-on-click=\"{{ paneStim }}\" aria-pressed=\"{{ panes.stimOnly }}\" style=\"font-size:12px;font-weight:600;padding:5px 10px;border:1px solid oklch(0.82 0.07 258);border-radius:4px 0 0 4px;background:{{ vw.stimBg }};color:{{ vw.stimFg }};cursor:pointer\">Passage Only<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ paneQuest }}\" aria-pressed=\"{{ panes.qOnly }}\" style=\"font-size:12px;font-weight:600;padding:5px 10px;border:1px solid oklch(0.82 0.07 258);border-left:0;border-radius:0 4px 4px 0;background:{{ vw.qBg }};color:{{ vw.qFg }};cursor:pointer\">Questions Only<\u002Fbutton>\n      <\u002Fdiv>\n      <span style=\"font-size:12px;color:oklch(0.48 0.015 258)\">Drag the divider to resize the panes.<\u002Fspan>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ guide.show }}\" hint-placeholder-val=\"{{ false }}\"><div aria-hidden=\"true\" style=\"position:absolute;left:0;right:0;top:{{ guide.top }};height:4px;background:oklch(0.90 0.18 95);box-shadow:0 0 0 1px oklch(0.78 0.15 95);pointer-events:none;z-index:5\"><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ mask.show }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"img\" aria-label=\"Masking box. Drag to move it over part of the screen.\" sc-camel-on-pointer-down=\"{{ mask.onDown }}\" sc-camel-on-pointer-move=\"{{ mask.onMove }}\" sc-camel-on-pointer-up=\"{{ mask.onUp }}\" style=\"position:absolute;left:{{ mask.x }};top:{{ mask.y }};width:280px;height:130px;background:oklch(0.15 0 0);border-radius:4px;cursor:move;z-index:6;touch-action:none;display:grid;place-items:center;color:oklch(0.62 0 0);font-size:12px;user-select:none\">drag to move<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ notepad.open }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:absolute;right:16px;top:12px;width:260px;background:oklch(0.97 0.06 95);border:1px solid oklch(0.85 0.1 95);border-radius:6px;padding:10px;z-index:7;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 14px oklch(0 0 0 / 0.12)\"><div style=\"display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700\">Notes<button sc-camel-on-click=\"{{ notepad.close }}\" style=\"font-size:12px;border:0;background:none;color:oklch(0.45 0.17 258);cursor:pointer;text-decoration:underline\">Close<\u002Fbutton><\u002Fdiv><textarea value=\"{{ notepad.text }}\" sc-camel-on-change=\"{{ notepad.onChange }}\" rows=\"6\" placeholder=\"Type a note for yourself. Notes are not scored.\" style=\"font-size:14px;padding:6px;border:1px solid oklch(0.85 0.1 95);border-radius:4px;resize:vertical;background:#fff\"><\u002Ftextarea><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ helpOpen }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"dialog\" aria-label=\"Help\" style=\"position:absolute;right:16px;top:12px;width:min(340px,90%);background:#fff;border:1px solid oklch(0.82 0.07 258);border-radius:8px;padding:14px 16px;z-index:8;box-shadow:0 6px 20px oklch(0 0 0 / 0.14);display:flex;flex-direction:column;gap:8px;animation:fadein .15s\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-weight:700\">How to answer<\u002Fspan><button sc-camel-on-click=\"{{ toggleHelp }}\" style=\"font-size:13px;border:0;background:none;color:oklch(0.45 0.17 258);cursor:pointer;text-decoration:underline\">Close<\u002Fbutton><\u002Fdiv><p style=\"margin:0;font-size:15px;line-height:1.5\">{{ helpText }}<\u002Fp><\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid oklch(0.88 0.006 258);background:oklch(0.975 0.004 258);flex:none;flex-wrap:wrap\">\n    <div role=\"group\" aria-label=\"Text to speech\" style=\"display:flex;align-items:center;gap:6px\">\n      <button sc-camel-on-click=\"{{ tts.play }}\" aria-label=\"Play. Read this question aloud.\" style=\"width:34px;height:34px;border-radius:50%;border:0;background:oklch(0.52 0.15 150);color:#fff;font-size:14px;cursor:pointer\">▶<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ tts.pause }}\" aria-label=\"Pause\" style=\"width:34px;height:34px;border-radius:50%;border:1px solid oklch(0.88 0.006 258);background:#fff;color:oklch(0.22 0.01 258);font-size:11px;font-weight:700;cursor:pointer\">❚❚<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ tts.skip }}\" aria-label=\"Skip to the next part\" style=\"width:34px;height:34px;border-radius:50%;border:1px solid oklch(0.88 0.006 258);background:#fff;color:oklch(0.22 0.01 258);font-size:11px;cursor:pointer\">▶▶<\u002Fbutton>\n      <span role=\"status\" style=\"font-size:12px;color:oklch(0.48 0.015 258);min-width:70px\">{{ tts.status }}<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"flex:1\"><\u002Fspan>\n    <sc-if value=\"{{ toastShow }}\" hint-placeholder-val=\"{{ false }}\"><span role=\"status\" style=\"font-size:13px;color:oklch(0.52 0.15 150);font-weight:700;animation:fadein .2s\">{{ toast }}<\u002Fspan><\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ back }}\" disabled=\"{{ backDisabled }}\" style=\"font-size:14px;font-weight:700;padding:8px 16px;border:1.5px solid oklch(0.50 0.17 258);border-radius:4px;background:#fff;color:oklch(0.50 0.17 258);cursor:pointer;opacity:{{ backOp }}\">Back<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ clear }}\" disabled=\"{{ clearDisabled }}\" style=\"font-size:14px;font-weight:700;padding:8px 16px;border:1.5px solid oklch(0.50 0.17 258);border-radius:4px;background:#fff;color:oklch(0.50 0.17 258);cursor:pointer;opacity:{{ clearOp }}\">Clear<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ next }}\" style=\"font-size:14px;font-weight:700;padding:8px 18px;border:1.5px solid oklch(0.50 0.17 258);border-radius:4px;background:oklch(0.50 0.17 258);color:#fff;cursor:pointer\">Next<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ save }}\" style=\"font-size:14px;font-weight:700;padding:8px 16px;border:1.5px solid oklch(0.50 0.17 258);border-radius:4px;background:#fff;color:oklch(0.50 0.17 258);cursor:pointer\">Save<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ reviewEnd }}\" style=\"font-size:14px;font-weight:700;padding:8px 16px;border:1.5px solid oklch(0.50 0.17 258);border-radius:4px;background:#fff;color:oklch(0.50 0.17 258);cursor:pointer\">Review/End<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scr.review }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Review/End\" style=\"flex:1;overflow:auto;padding:32px 20px;background:oklch(0.975 0.004 258)\">\n    <div style=\"width:min(640px,100%);margin:0 auto;background:#fff;border:1px solid oklch(0.88 0.006 258);border-radius:8px;padding:28px 32px;display:flex;flex-direction:column;gap:18px\">\n      <h1 style=\"margin:0;font-size:22px\">Review your test<\u002Fh1>\n      <p style=\"margin:0;font-size:15px;color:oklch(0.48 0.015 258)\">Click a question to go back to it. When you are done, click END.<\u002Fp>\n      <div style=\"border:1px solid oklch(0.88 0.006 258);border-radius:6px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px 14px;background:oklch(0.975 0.004 258);font-size:12px;font-weight:700;letter-spacing:.06em;color:oklch(0.48 0.015 258)\"><span>QUESTION<\u002Fspan><span>STATUS<\u002Fspan><span>FLAG<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ review.rows }}\" as=\"r\" hint-placeholder-count=\"10\">\n          <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"display:grid;grid-template-columns:1fr 1fr 1fr;width:100%;text-align:left;padding:10px 14px;border:0;border-top:1px solid oklch(0.88 0.006 258);background:#fff;font:inherit;font-size:15px;cursor:pointer;color:inherit\"><span style=\"font-weight:600\">{{ r.label }}<\u002Fspan><span style=\"color:{{ r.statusColor }};font-weight:600\">{{ r.status }}<\u002Fspan><span style=\"color:oklch(0.55 0.19 25);font-weight:600\">{{ r.flag }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:10px\">\n        <button sc-camel-on-click=\"{{ back }}\" style=\"font-size:14px;font-weight:700;letter-spacing:.04em;padding:10px 18px;border:1.5px solid oklch(0.50 0.17 258);border-radius:4px;background:#fff;color:oklch(0.50 0.17 258);cursor:pointer\">GO BACK<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ endTest }}\" style=\"font-size:15px;font-weight:700;letter-spacing:.06em;padding:10px 28px;border:0;border-radius:4px;background:oklch(0.50 0.17 258);color:#fff;cursor:pointer\">END<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scr.confirm }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"End confirmation\" style=\"flex:1;display:grid;place-items:center;background:oklch(0.975 0.004 258)\">\n    <div role=\"dialog\" aria-label=\"End the test\" style=\"width:min(440px,90%);background:#fff;border:1px solid oklch(0.88 0.006 258);border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:16px;text-align:center\">\n      <div style=\"font-size:20px;font-weight:700\">Are you sure you want to end the test?<\u002Fdiv>\n      <p style=\"margin:0;color:oklch(0.48 0.015 258);font-size:15px;line-height:1.5\">{{ review.summary }} You cannot change answers after you end.<\u002Fp>\n      <div style=\"display:flex;justify-content:center;gap:12px\">\n        <button sc-camel-on-click=\"{{ confirmNo }}\" style=\"font-size:14px;font-weight:700;letter-spacing:.04em;padding:10px 22px;border:1.5px solid oklch(0.50 0.17 258);border-radius:4px;background:#fff;color:oklch(0.50 0.17 258);cursor:pointer\">NO<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ confirmYes }}\" style=\"font-size:14px;font-weight:700;letter-spacing:.06em;padding:10px 26px;border:0;border-radius:4px;background:oklch(0.52 0.15 150);color:#fff;cursor:pointer\">YES<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scr.done }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Signed out\" style=\"flex:1;display:grid;place-items:center;background:oklch(0.975 0.004 258)\">\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center\">\n      <div style=\"font-size:24px;font-weight:700\">Your test has been submitted.<\u002Fdiv>\n      <p style=\"margin:0;font-size:16px;color:oklch(0.48 0.015 258)\">Thank you, Avery. You can sign out now.<\u002Fp>\n      <button sc-camel-on-click=\"{{ signOut }}\" style=\"font-size:15px;font-weight:700;letter-spacing:.06em;padding:12px 30px;border:0;border-radius:4px;background:oklch(0.50 0.17 258);color:#fff;cursor:pointer\">SIGN OUT<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ scr.closing }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Closing map\" style=\"flex:1;overflow:auto;padding:28px 32px;background:oklch(0.975 0.025 80)\">\n    <div style=\"width:min(980px,100%);margin:0 auto;display:flex;flex-direction:column;gap:22px;font-size:15px;line-height:1.5\">\n      <span style=\"align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:999px;background:#fff;border:1px solid oklch(0.86 0.07 80);color:oklch(0.42 0.10 70)\">NOTES ONLY · NOT A STUDENT SCREEN<\u002Fspan>\n      <h1 style=\"margin:0;font-size:26px;line-height:1.2\">The five moves, mapped to the screens<\u002Fh1>\n      <p style=\"margin:0;max-width:820px\"><b>Now<\u002Fb> runs on what the vendor produces today: standard, skill description, credit, raw points. <b>Soon<\u002Fb> needs what the working group can supply: practice and crosscutting-concept tags, levels, assertions. <b>Eventually<\u002Fb> needs a change in what the vendor or the platform produces: response patterns, distractor rationales, the stimulus layout for science, video and simulation.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ closing.moves }}\" as=\"m\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:36px minmax(0,1.2fr) minmax(0,1.3fr) auto;gap:16px;align-items:start;padding:14px 16px;background:#fff;border:1px solid oklch(0.86 0.07 80);border-radius:8px\">\n            <span style=\"font-size:24px;font-weight:700;color:oklch(0.42 0.10 70);line-height:1\">{{ m.n }}<\u002Fspan>\n            <div><div style=\"font-weight:700;font-size:16px\">{{ m.title }}<\u002Fdiv><div style=\"font-size:14px;color:oklch(0.48 0.015 258);margin-top:4px\">{{ m.why }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:14px\"><div style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.48 0.015 258)\">WHERE<\u002Fdiv>{{ m.where }}<\u002Fdiv>\n            <span style=\"font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:{{ m.bg }};color:{{ m.fg }};white-space:nowrap\">{{ m.tag }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px\">\n        <div style=\"background:#fff;border:1px solid oklch(0.86 0.07 80);border-radius:8px;padding:18px 20px\"><h2 style=\"margin:0 0 10px;font-size:17px\">Item map: changes to consider<\u002Fh2><ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px\"><sc-for list=\"{{ closing.changes }}\" as=\"c\" hint-placeholder-count=\"4\"><li>{{ c.t }}<\u002Fli><\u002Fsc-for><\u002Fol><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid oklch(0.86 0.07 80);border-radius:8px;padding:18px 20px\"><h2 style=\"margin:0 0 10px;font-size:17px\">Open questions for OPI<\u002Fh2><ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px\"><sc-for list=\"{{ closing.questions }}\" as=\"c\" hint-placeholder-count=\"5\"><li>{{ c.t }}<\u002Fli><\u002Fsc-for><\u002Fol><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<sc-if value=\"{{ notesOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<aside aria-label=\"Design notes\" style=\"width:min(380px,40%);flex:none;background:oklch(0.975 0.025 80);border-left:3px solid oklch(0.86 0.07 80);overflow:auto;padding:18px 20px 32px;display:flex;flex-direction:column;gap:14px;font-size:14px;line-height:1.45;color:oklch(0.22 0.01 258)\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap\">\n    <span style=\"font-size:11px;font-weight:700;letter-spacing:.08em;color:oklch(0.42 0.10 70)\">DESIGN NOTES<\u002Fspan>\n    <button sc-camel-on-click=\"{{ goClosing }}\" style=\"font-size:12px;font-weight:600;padding:4px 10px;border:1px solid oklch(0.86 0.07 80);border-radius:999px;background:#fff;color:oklch(0.42 0.10 70);cursor:pointer\">Closing map for the vendor →<\u002Fbutton>\n  <\u002Fdiv>\n  <label style=\"display:flex;gap:10px;align-items:center;padding:10px 12px;background:#fff;border:1px solid oklch(0.86 0.07 80);border-radius:6px;cursor:pointer;font-weight:600\">\n    <input type=\"checkbox\" checked=\"{{ avery }}\" sc-camel-on-change=\"{{ toggleAvery }}\" style=\"width:16px;height:16px;margin:0;accent-color:oklch(0.42 0.10 70)\">Show one student's responses (Avery R.)\n  <\u002Flabel>\n  <sc-if value=\"{{ avery }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:13px;color:oklch(0.42 0.10 70)\">Avery R. is the student in the report set: full credit everywhere except A3 (middle cards reversed), A4 (chose 4 in 10), A5 (claim and evidence right, reasoning wrong), and B3 (used one feature of three). Editing an item while this is on edits Avery's copy.<\u002Fp><\u002Fsc-if>\n  <h2 style=\"margin:0;font-size:17px;line-height:1.3\">{{ notes.title }}<\u002Fh2>\n  <sc-if value=\"{{ notes.isItem }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ notes.chips }}\" as=\"c\" hint-placeholder-count=\"0\"><span style=\"font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:#fff;border:1px solid oklch(0.86 0.07 80)\">{{ c.t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.42 0.10 70)\">SLICE OF THE STANDARD<\u002Fspan><p style=\"margin:0\">{{ notes.slice }}<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.42 0.10 70)\">WHAT THIS ITEM ADDS<\u002Fspan><p style=\"margin:0\">{{ notes.adds }}<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.42 0.10 70)\">SCORING<\u002Fspan><p style=\"margin:0\">{{ notes.scoring }}<\u002Fp><\u002Fdiv>\n    <sc-if value=\"{{ notes.hasIefa }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:10px 12px;border:1px dashed oklch(0.42 0.10 70);border-radius:6px;background:#fff\">{{ notes.iefa }}<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ notes.hasCheck }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:10px 12px;border:1px dashed oklch(0.42 0.10 70);border-radius:6px;background:#fff\">{{ notes.check }}<\u002Fdiv><\u002Fsc-if>\n    <div role=\"status\" style=\"padding:10px 12px;background:#fff;border:1px solid oklch(0.86 0.07 80);border-radius:6px;display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.42 0.10 70)\">THIS RESPONSE<\u002Fspan>\n      <span>{{ notes.live }}<\u002Fspan>\n      <span style=\"font-weight:700\">{{ notes.liveCredit }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.42 0.10 70)\">ASSERTIONS BY RESPONSE · WHAT THE STUDENT DID<\u002Fspan>\n      <sc-for list=\"{{ notes.assertions }}\" as=\"a\" hint-placeholder-count=\"0\">\n        <div style=\"display:grid;grid-template-columns:12px 46px 1fr;gap:8px;padding:5px 6px;border-radius:4px;background:{{ a.bg }};color:{{ a.color }};font-weight:{{ a.fw }}\"><span aria-hidden=\"true\">{{ a.mark }}<\u002Fspan><span style=\"font-size:12px\">{{ a.credit }}<\u002Fspan><span>{{ a.says }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.42 0.10 70)\">FEEDS<\u002Fspan><p style=\"margin:0\">{{ notes.feeds }}<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.42 0.10 70)\">WHAT THE PLATFORM HAS TO RECORD<\u002Fspan>\n      <sc-for list=\"{{ notes.platform }}\" as=\"p\" hint-placeholder-count=\"0\"><div style=\"display:flex;gap:8px;align-items:flex-start\"><span style=\"flex:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:{{ p.bg }};color:{{ p.fg }};min-width:64px;text-align:center\">{{ p.when }}<\u002Fspan><span>{{ p.need }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ notes.isScreen }}\" hint-placeholder-val=\"{{ false }}\">\n    <sc-for list=\"{{ notes.paras }}\" as=\"p\" hint-placeholder-count=\"0\"><p style=\"margin:0\">{{ p.t }}<\u002Fp><\u002Fsc-for>\n    <sc-if value=\"{{ notes.hasBounds }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.42 0.10 70)\">BOUNDARIES · WHICH SLICE OF EACH STANDARD, IN WHAT CONTEXT<\u002Fspan><sc-for list=\"{{ notes.bounds }}\" as=\"b\" hint-placeholder-count=\"0\"><p style=\"margin:0;padding:8px 10px;background:#fff;border-radius:4px\">{{ b.t }}<\u002Fp><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ notes.hasPlatform }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;color:oklch(0.42 0.10 70)\">PLATFORM<\u002Fspan>\n      <sc-for list=\"{{ notes.platform }}\" as=\"p\" hint-placeholder-count=\"0\"><div style=\"display:flex;gap:8px;align-items:flex-start\"><span style=\"flex:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:{{ p.bg }};color:{{ p.fg }};min-width:64px;text-align:center\">{{ p.when }}<\u002Fspan><span>{{ p.need }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv><\u002Fsc-if>\n  <\u002Fsc-if>\n<\u002Faside>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;signin&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;signin&quot;,&quot;directions&quot;,&quot;a0&quot;,&quot;a1&quot;,&quot;a2&quot;,&quot;a3&quot;,&quot;a4&quot;,&quot;a5&quot;,&quot;a6&quot;,&quot;b0&quot;,&quot;b1&quot;,&quot;b2&quot;,&quot;b3&quot;,&quot;b4&quot;,&quot;review&quot;,&quot;closing&quot;],&quot;section&quot;:&quot;Prototype&quot;},&quot;showNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;showAvery&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nclass Component extends DCLogic {\n  static ORDER = ['signin','welcome','tests','code','directions','a0','a1','a2','a3','a4','a5','a6','b0','b1','b2','b3','b4','review','confirm','done'];\n  static ITEMS = ['a1','a2','a3','a4','a5','a6','b1','b2','b3','b4'];\n  static KEY = 'mast-testlet-proto-v1';\n  static C = { blue:'oklch(0.50 0.17 258)', blueLt:'oklch(0.955 0.025 258)', blueBd:'oklch(0.82 0.07 258)', ink:'oklch(0.22 0.01 258)', muted:'oklch(0.48 0.015 258)', line:'oklch(0.88 0.006 258)', panel:'oklch(0.975 0.004 258)', green:'oklch(0.52 0.15 150)', red:'oklch(0.55 0.19 25)', pink:'oklch(0.90 0.09 350)', yellow:'oklch(0.90 0.18 95)', grey:'oklch(0.62 0.01 258)' };\n  static blank() {\n    return { a1:null, a2:[], a3:{ order:['c3','c1','c4','c2'], placed:false }, a4:null, a5:{ claim:null, evidence:null, reasoning:null }, a6:{ pick:null, locked:false, ran:false }, b1:null, b2:null, b3:{ e1:null, e2:null, e3:null }, b4:{ ev:[], reason:null } };\n  }\n  static init() {\n    return { screen:null, notesOpen:null, avery:null, visited:{}, resp:Component.blank(), averyResp:null, flags:{},\n      signinUser:'avery.r', signinPass:'', codeVal:'', testsMsg:'',\n      toolsOpen:false, tool:'pointer', zoom:1, marks:{}, guideY:null, mask:null, notepadOpen:false, notepadText:'',\n      helpOpen:false, split:50, paneMode:'both', viewAll:false,\n      chartW:400, hoverYear:null, range:{ from:1990, to:2020 }, dragging:false, fig1Text:false, videoOpen:false,\n      t1sort:null, t1hl:{}, rockOpen:{}, boneAnimal:'maia', boneStage:'adult',\n      a3sel:null, a3drag:null, a5open:{ claim:true, evidence:false, reasoning:false },\n      sim:{ running:false, step:0 }, tts:{ playing:false, paused:false }, toast:'' };\n  }\n  state = { D:null, ...Component.init() };\n\n  componentDidMount() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(Component.KEY) || 'null');\n      if (saved) {\n        const s = {};\n        ['resp','averyResp','flags','visited','notesOpen','avery','split','viewAll'].forEach(k => { if (saved[k] !== undefined) s[k] = saved[k]; });\n        if (!this.props.startScreen && saved.screen) s.screen = saved.screen;\n        this.setState(s);\n      }\n    } catch (e) {}\n    import((window.__resources && window.__resources.testletData) || new URL('./testlet-data.js', document.baseURI).href).then(mod => {\n      this.setState(s => ({ D: mod, averyResp: s.averyResp || JSON.parse(JSON.stringify(mod.AVERY)) }));\n    }).catch(err => console.error('testlet data failed to load', err));\n  }\n  componentDidUpdate() {\n    const s = this.state;\n    const json = JSON.stringify({ resp:s.resp, averyResp:s.averyResp, flags:s.flags, visited:s.visited, screen:s.screen, notesOpen:s.notesOpen, avery:s.avery, split:s.split, viewAll:s.viewAll });\n    if (json !== this._lastSaved) { this._lastSaved = json; try { localStorage.setItem(Component.KEY, json); } catch (e) {} }\n  }\n  componentWillUnmount() { clearInterval(this.simTimer); clearTimeout(this.toastT); if (this.ro) this.ro.disconnect(); try { speechSynthesis.cancel(); } catch (e) {} }\n\n  get screen() { return this.state.screen ?? this.props.startScreen ?? 'signin'; }\n  get notesOpen() { return this.state.notesOpen ?? (this.props.showNotes ?? false); }\n  get averyOn() { return this.state.avery ?? (this.props.showAvery ?? false); }\n  get R() { const D = this.state.D; return this.averyOn ? (this.state.averyResp || (D ? D.AVERY : Component.blank())) : this.state.resp; }\n\n  go = (id) => {\n    this.stopTTS(); clearInterval(this.simTimer);\n    this.setState(s => ({ screen:id, visited:{ ...s.visited, [id]:true }, helpOpen:false, a3sel:null, guideY:null, sim: s.sim.running ? { running:false, step:0 } : s.sim }));\n  };\n  step(d) { const o = Component.ORDER, i = o.indexOf(this.screen), j = i + d; if (i < 0 || j < 0 || j >= o.length) return; if (d < 0 && this.screen === 'a0') return; this.go(o[j]); }\n\n  setResp(id, val) { const key = this.averyOn ? 'averyResp' : 'resp'; this.setState(s => ({ [key]: { ...(s[key] || Component.blank()), [id]: val } })); }\n  clear = () => {\n    const id = this.screen; if (!Component.ITEMS.includes(id)) return;\n    this.setResp(id, Component.blank()[id]); clearInterval(this.simTimer);\n    this.setState(s => { const marks = {}; Object.keys(s.marks).forEach(k => { if (!k.startsWith(id + ':')) marks[k] = s.marks[k]; }); return { marks, a3sel:null, sim:{ running:false, step:0 }, a5open:{ claim:true, evidence:false, reasoning:false } }; });\n  };\n  optClick(itemId, oid, pick) {\n    const t = this.state.tool, key = itemId + ':' + oid;\n    if (t === 'hl' || t === 'strike') this.setState(s => { const m = { ...s.marks }; const cur = { ...(m[key] || {}) }; cur[t] = !cur[t]; m[key] = cur; return { marks:m }; });\n    else if (t === 'eraser') this.setState(s => { const m = { ...s.marks }; delete m[key]; return { marks:m }; });\n    else pick();\n  }\n  tagOf(id) { if (id.length === 1) return id.toUpperCase(); if (id[0] === 'r') return 'ABC'[+id[1] - 1] || ''; return id.slice(1); }\n  rows(itemId, list, isSel, pick, kind, locked) {\n    const C = Component.C, tags = this.notesOpen;\n    return list.map(o => {\n      const sel = isSel(o.id), mk = this.state.marks[itemId + ':' + o.id] || {};\n      return { id:o.id, text:o.text, sel, tag: tags ? this.tagOf(o.id) : '', cur: locked ? 'default' : 'pointer',\n        bd: sel ? C.blue : C.line, bg: sel ? C.blueLt : '#fff', dotBd: sel ? C.blue : C.grey, dotBg: sel ? C.blue : '#fff',\n        check: kind === 'check' && sel ? '✓' : '', deco: mk.strike ? `line-through ${C.blue} 2px` : 'none', hl: mk.hl ? C.pink : 'transparent',\n        onClick: () => { if (locked) return; this.optClick(itemId, o.id, () => pick(o.id)); } };\n    });\n  }\n\n  score(id, R) {\n    const r = R[id];\n    switch (id) {\n      case 'a1': case 'a4': case 'b1': case 'b2': return { pts: r === 'a' ? 1 : 0, max:1, pattern: r ? [r] : ['blank'] };\n      case 'a2': { const s = new Set(r); const full = s.size === 2 && s.has('a') && s.has('b'); const p = []; if (!r.length) p.push('blank'); else if (full) p.push('full'); else { if (s.has('c')) p.push('c'); if (s.has('d')) p.push('d'); if (!s.has('c') && !s.has('d')) p.push('one'); } return { pts: full ? 1 : 0, max:1, pattern:p }; }\n      case 'a3': { if (!r.placed) return { pts:0, max:2, pattern:['blank'] }; const o = r.order, K = ['c1','c2','c3','c4']; if (o.join() === K.join()) return { pts:2, max:2, pattern:['exact'] }; if (o[0] === 'c1' && o[3] === 'c4' && o[1] === 'c3' && o[2] === 'c2') return { pts:1, max:2, pattern:['midrev'] }; const oneMis = K.some(c => o.fi
