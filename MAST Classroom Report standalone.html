  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2 chose the harvest rule that would slow the change. The mechanism is the gap: 7 ordered the full causal chain on the model, 8 predicted next year’s share, 5 carried the explanation to inheritance.\" },\n        { name: \"Not assessed\", quiet: true, text: \"The other five crosscutting concepts are not tagged on this testlet.\" }\n      ],\n      note: \"Each concept is shown on its item that reaches furthest, named under the concept, with the credit key from the skills table. The other items tagged to the concept are listed under its name.\"\n    },\n    dci: {\n      label: \"Core idea\", title: \"The class by core idea\", mode: \"credit\",\n      rows: [\n        { name: \"LS4.A Evidence of common ancestry and diversity\", shownOn: \"B4\", also: [\"B1\", \"B2\", \"B3\"], text: \"The class reads the fossil record: 22 ordered the layers and 20 explained skeletal similarities. Inferring relationship is the harder step: 11 used all three embryo features, and 8 explained why shared structures point to a closer relationship between Maiasaura and birds.\" },\n        { name: \"LS4.B Natural selection\", shownOn: \"A5\", also: [\"A1\", \"A2\", \"A3\", \"A6\"], text: \"22 of 24 made at least a claim about why the horns got smaller; 5 carried it to inheritance. 7 built the full chain on the model and 12 chose the harvest rule that would slow the change. The observation and its cause are secure; the mechanism is not.\" },\n        { name: \"LS4.C Adaptation\", shownOn: \"A4\", also: [], text: \"One item. 8 of 24 used the harvest rate to predict next year’s share of large-horned fathers.\" }\n      ],\n      note: \"Each core idea is shown on its item that reaches furthest, named under the idea, with the credit key from the skills table. The other items tagged to the idea are listed under its name.\"\n    }\n  },\n\n  // Panel 5\n  matrixNote: \"Cells show points earned. The count row is primary; the share row is the same information for a reader who thinks in percentages. T of: \"1 of 3\", text: \"The horns got smaller because the sheep with big horns kept getting shot, so the sheep started growing smaller horns so they would be safe.\" },\n      { level: 2, label: \"Claim and evidence\", of: \"2 of 3\", text: \"Hunters took the rams with the biggest horns. Table 1 shows 80% of large-horned rams were harvested before age 6, so they didn’t get to have many lambs. That’s why the average went from 70 cm to about 56 cm on the graph.\" },\n      { level: 3, label: \"Claim, evidence, and reasoning\", of: \"3 of 3\", text: \"The average horn length dropped from about 70 cm in 1990 to about 56 cm in 2020 (Figure 1). Normally large-horned rams father the most lambs (9 compared to 2), but Table 1 shows 80% of them were harvested before age 6, before their best breeding years. So most lambs were fathered by medium- and small-horned rams. Since horn size is inherited, each generation more lambs were born with genes for smaller horns, and the average kept going down.\" }\n    ],\n    responsesNote: \"Needs written responses, which topic testlets do not produce. These come from the grade 7 performance task and are shown here because sorting three responses on the board is the move the next panel opens with.\"\n  },\n\n  // Panel 7. summary is authored for the testlet; why is the class-specific sentence a rule would generate.\n  moves: {\n    list: [\n      { title: \"Sort three explanations as a class.\", serves: \"reasoning criteria\",\n        summary: \"Put three responses on the board, weakest to strongest, and ask what the strongest one adds.\",\n        why: \"The answer, who gets to breed and what the lambs inherit, is the step 17 students skipped.\",\n        full: \"Use the three unnamed responses in panel 6. Students read all three and, in pairs, decide which is strongest and name what it has that the others do not. Collect answers until both parts are on the board: the large-horned rams were removed before they bred, and horn size is inherited. Close by rewriting the middle response together so it reaches the third level.\",\n        offroads: [\n          \"If the class ranks the claim-only response highest because it sounds right, ask which sentence in it the graph or the table could check.\",\n          \"If pairs finish early, hand back their own A5 choice and ask which of the three responses it is closest to.\",\n          \"If written responses are not available, use the three A5 answer choices in the same order.\"\n        ] },\n      { title: \"Re-run the model with a twist.\", serves: \"reasoning content\",\n        summary: \"Card-sort again for a herd where hunters may only take rams older than 8.\",\n        why: \"It reuses the class’s strength, reading the data, to repair the sequence error.\",\n        full: \"Reuse the A3 card sort with one change to the harvest rule: hunters may take only rams older than 8. Groups sequence the cards for the new herd, then set the two sequences side by side. The reversal 9 students made, lambs inheriting smaller horns before smaller-horned rams father the lambs, shows up as the step that no longer fits.\",\n        offroads: [\n          \"If groups still place inheritance before breeding, go back to the harvest table from A2: which rams father the most lambs once the large-horned ones are gone?\",\n          \"If the sort goes quickly, ask what the horn-length graph from A1 would look like after 30 years under the new rule.\"\n        ] },\n      { title: \"Ten minutes on the proportions.\", serves: \"content\",\n        summary: \"Forty large-horned rams, 80 percent harvested: who fathers next year’s lambs? Small numbers, same phenomenon.\",\n        why: \"8 of 24 carried the harvest rate through on A4.\",\n        full: \"Start with whole numbers on the board: forty large-horned rams, 80 percent harvested before age 6. How many are left to breed? If next year’s lambs come from the rams that remain, what share of the fathers are large-horned? Only height:inherit}\n.namebtn:hover{color:var(--sky)}\n.ideas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}\n.idea{border:1px solid var(--line);border-radius:5px;padding:10px 12px;font-size:13.5px}\n.idea .cnt{font-size:20px;font-weight:600;line-height:1.1}\n.idea .cnt small{font-size:12px;font-weight:400;color:var(--ink-3);margin-left:4px}\n.idea p{margin:4px 0 0}\n.resp{border-left:3px solid var(--sky);background:#F7F9FB;padding:10px 14px;margin:8px 0 10px;line-height:1.5;max-width:76ch}\n.resp.lv3{border-left-color:var(--full)} .resp.lv2{border-left-color:var(--partial)} .resp.lv1{border-left-color:var(--none)}\n.resp .who{font-size:12px;color:var(--ink-3);margin-bottom:4px} .resp .who b{color:var(--ink)}\n\n/* panel 7 */\nol.moves{margin:6px 0 0;padding:0;list-style:none;counter-reset:mv}\n.move{border:1px solid var(--line);border-radius:5px;margin-bottom:8px;max-width:84ch}\n.move-h{display:flex;width:100%;text-align:left;background:#fff;border:0;padding:10px 12px;cursor:pointer;gap:10px;align-items:flex-start;border-radius:5px;line-height:1.5}\n.move-h:hover{background:#F7F9FB}\n.move-h::before{counter-increment:mv;content:counter(mv) \".\";color:var(--ink-3);font-weight:600;min-width:16px}\n.move-h .mt{flex:1}\n.move-h .tw{color:var(--sky-deep);font-size:12px;white-space:nowrap;padding-top:2px;text-decoration:underline;text-underline-offset:2px}\n.move-body{padding:0 12px 12px 38px;color:var(--ink-2);font-size:13.5px}\n.move-body h4{margin:8px 0 3px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}\n.move-body p{margin:0 0 6px}\n.move-body ul{margin:0;padding-left:18px} .move-body li{margin:3px 0}\n.res{font-size:13px;color:var(--ink-2);margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}\n.res span{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:2px 8px;background:#FAFBFC}\n.res span.later{border-style:dashed;color:var(--ink-3)}\n\n/* panel 8 */\n.watch{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.watch>div{border:1px solid var(--line);border-radius:5px;padding:10px 12px;font-size:13.5px}\n.watch h3{margin:0 0 4px;font-size:13.5px;font-weight:600}\n.watch p{margin:0;max-width:none}\n\n/* fine print */\n.fine{font-size:12.5px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:12px;margin-top:16px;line-height:1.55}\n.fine .synthline{color:#7A4B12;font-weight:600}\n.fine .linkbtn{font-size:12.5px;font-weight:600;margin-left:2px}\n\n/* drawer */\n.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(31,41,51,.14);z-index:60;overflow-y:auto;font-size:13.5px;padding:18px 20px 28px}\n.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}\n.drawer h2{font-size:20px;margin:0;font-weight:600}\n.drawer h2:focus{outline:none}\n.drawer .close{border:1px solid var(--line);background:#fff;border-radius:4px;width:40px;height:40px;cursor:pointer;font-size:20px;line-height:1;flex:none}\n.drawer .close:hover{border-color:var(--sky);color:var(--sky-deep)}\n.drawer .sum{color:var(--ink-2);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.drawer h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:18px 0 6px;font-weight:600}\n.ditem{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);align-items:start}\n.ditem .cell{width:36px}\n.ditem .idlab{font-size:11px;color:var(--ink-3);text-align:center;margin-top:2px;white-space:nowrap}\n.ditem .sk{font-weight:600;line-height:1.35} .ditem .cm{color:var(--ink-2);margin-top:2px;line-height:1.4}\n.drawer .groups{color:var(--ink-2)}\n\n/* tooltip */\n#tip{position:fixed;z-index:70;max-width:320px;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:4px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}\n#tip b{color:#fff}\n\n/* dialog */\ndialog{border:1px solid var(--line);border-radius:6px;padding:22px 24px;max-width:620px;width:calc(100vw - 32px);color:var(--ink);font-size:14px;line-height:1.5}\ndialog::backdrop{background:rgba(31,41,51,.45)}\ndialog h2{margin:0 0 10px;font-size:18px}\ndialog ul{margin:0 0 16px;padding-left:20px} dialog li{margin:6px 0}\ndialog .close{border:1px solid var(--line);background:#fff;border-radius:4px;padding:8px 14px;cursor:pointer;min-height:40px}\ndialog .close:hover{border-color:var(--sky);color:var(--sky-deep)}\n\n@media (max-width:1000px){\n  .frame{display:block;padding:12px}\n  nav.index{position:sticky;top:var(--top);z-index:30;background:var(--paper);margin:-12px -12px 12px;padding:6px 12px}\n  nav.index ol{display:flex;overflow-x:auto;border-left:0;gap:2px;scrollbar-width:thin}\n  nav.index a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;margin:0;padding:8px 10px;min-height:40px;display:flex;align-items:center}\n  nav.index a[aria-current=\"true\"]{border-bottom-color:var(--sky)}\n  nav.index .hint{display:none}\n  .report{padding:16px}\n}\n@media (max-width:720px){\n  .topbar-in{gap:10px;padding:7px 12px}\n  .switch{margin-left:0}\n  .rpt-head{grid-template-columns:1fr}\n  .pracrow{grid-template-columns:1fr;gap:6px}\n  .buckets,.ideas,.watch{grid-template-columns:1fr}\n  .move-body{padding-left:12px}\n}\n@media (prefers-reduced-motion:reduce){ *{transition:none !important} }\n\n@media print{\n  @page{margin:12mm 14mm}\n  body{background:#fff;font-size:10.5pt;color:#000}\n  .topbar,nav.index,.drawer,#tip,dialog,.noprint,.use .hint,.linkbtn,.move-h .tw,.mx-controls .lvl,.mx-status,.cer-names{display:none !important}\n  .print-only{display:block}\n  .frame{display:block;padding:0;max-width:none}\n  .report{border:0;padding:0;border-radius:0}\n  .panel,.rpt-head,.use,.fine{break-inside:avoid}\n  .panel.allow-break{break-inside:auto}\n  table.matrix{min-width:0;font-size:8.5pt}\n  .matrix-wrap{overflow:visible}\n  table.matrix tbody tr{break-inside:avoid}\n  thead{display:table-header-group}\n  .move-body[hidden]{display:block !important}\n  .move-h{padding-bottom:4px}\n  .stack button{box-shadow:none !important}\n  .usebtn{border:0;padding:2px 0}\n  .usebtn::before{display:none}\n  .today [data-needs]{filter:none;opacity:.35}\n  .printhead{font-size:9.5pt;color:#444;border-bottom:1px solid #999;padding-bottom:6px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px}\n  .printhead b{color:#7A4B12}\n  .hownot-print{border-top:1px dashed #999;margin-top:14px;padding-top:10px;font-size:10pt}\n  .hownot-print h2{font-size:12pt;margin:0 0 6px}\n  .hownot-print ul{margin:0;padding-left:18px}\n  a[href]::after{content:\"\"}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<header class=\"topbar\" id=\"topbar\">\n  <div class=\"topbar-in\">\n    <div class=\"plat\"><i aria-hidden=\"true\"><\u002Fi><span id=\"platName\"><\u002Fspan><\u002Fdiv>\n    <div class=\"chipkey\" id=\"chipKey\" aria-label=\"Data readiness key\"><\u002Fdiv>\n    <span class=\"synth\" id=\"synthBadge\">Synthetic data<\u002Fspan>\n    <button type=\"button\" class=\"switch\" id=\"todaySwitch\" role=\"switch\" aria-checked=\"false\">\n      <span class=\"track\" aria-hidden=\"true\"><span class=\"knob\"><\u002Fspan><\u002Fspan>\n      <span class=\"lbl\">What runs on today’s data<\u002Fspan>\n      <span class=\"st\" aria-hidden=\"true\">Off<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"todaybanner\" id=\"todayBanner\" role=\"status\" hidden=\"\"><div class=\"in\"><\u002Fdiv><\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"frame\">\n  <nav class=\"index\" aria-label=\"Report panels\">\n    <ol id=\"indexList\"><\u002Fol>\n    <p class=\"hint\">Scroll, or choose a panel.<\u002Fp>\n  <\u002Fnav>\n  <main class=\"report\" id=\"report\">\n    <div class=\"print-only printhead\"><span>MAST Science classroom report, interactive prototype<\u002Fspan><b>Synthetic data, for illustration<\u002Fb><\u002Fdiv>\n    <div id=\"head\"><\u002Fdiv>\n    <div id=\"panels\"><\u002Fdiv>\n    <div class=\"fine\" id=\"fine\"><\u002Fdiv>\n    <section class=\"print-only hownot-print\" id=\"hownotPrint\" aria-hidden=\"true\"><\u002Fsection>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<aside class=\"drawer\" id=\"drawer\" role=\"dialog\" aria-labelledby=\"drawerTitle\" hidden=\"\"><\u002Faside>\n<dialog id=\"hownot\" aria-labelledby=\"hownotTitle\"><\u002Fdialog>\n<div id=\"tip\" role=\"tooltip\" hidden=\"\"><\u002Fdiv>\n<noscript><p style=\"padding:20px\">This prototype needs JavaScript to render the report.<\u002Fp><\u002Fnoscript>\n\n<script>\n(function () {\n  'use strict';\n  const R = REPORT;\n  const $ = (s, el) => (el || document).querySelector(s);\n  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));\n  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n\n  // ---- readiness chips and \"today\" categories (UI vocabulary, not testlet data)\n  const CHIP = { now: 'Now', next: 'Soon', later: 'Eventually' };\n  const CHIP_T = {\n    now: 'Runs on the credit export the vendor returns today',\n    next: 'Needs practice tags, cut points, or rule-generated text',\n    later: 'Needs response patterns, distractor rationales, or written responses'\n  };\n  const chip = k => `<span class=\"chip ${k}\" title=\"${CHIP_T[k]}\">${CHIP[k]}<\u002Fspan>`;\n  const chips = ks => `<span class=\"tags\">${ks.map(chip).join('')}<\u002Fspan>`;\n  const NEEDS = {\n    practice: 'practice and concept tags',\n    cuts: 'cut points and levels',\n    rules: 'rule-generated summary text',\n    difficulty: 'item difficulty',\n    patterns: 'response patterns for technology-enhanced items',\n    rationales: 'distractor rationales',\n    responses: 'written responses'\n  };\n  const needsLabel = s => s.split(/\\s+/).map(k => NEEDS[k] || k).join(' and ');\n  const CREDIT = { f: 'Full credit', p: 'Partial credit', z: 'No credit', u: 'Unanswered' };\n\n  // ---- derived data\n  const items = R.items, ix = {};\n  items.forEach((it, i) => { ix[it.id] = i; });\n  const avail = items.reduce((a, it) => a + it.points, 0);\n  const bands = R.levels.bands;\n  const levelFor = t => bands.find(b => t / avail >= b.min) || bands[bands.length - 1];\n  const students = R.students.map(s => {\n    const total = s.scores.reduce((a, v) => a + (v || 0), 0);\n    return { name: s.name, scores: s.scores, total, level: levelFor(total) };\n  });\n  const N = students.length;\n  const byName = {}; students.forEach(s => { byName[s.name] = s; });\n  const classPct = Math.round(students.reduce((a, s) => a + s.total, 0) / (N * avail) * 100);\n  const credit = (it, v) => v == null ? 'u' : v >= it.points ? 'f' : v > 0 ? 'p' : 'z';\n  const score = (s, id) => s.scores[ix[id]];\n  const dist = id => { const it = items[ix[id]], d = { f: 0, p: 0, z: 0, u: 0 }; students.forEach(s => { d[credit(it, score(s, id))]++; }); return d; };\n  const levelCount = id => students.filter(s => s.level.id === id).length;\n  const pc = (c, n) => c / n * 100;\n  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;\n\n  const state = { use: null, today: false, dim: R.dimensions.order[0], sortKey: 'total', sortDir: 'desc', level: 'all', open: null, cer: null };\n\n  // ---- shared renderers\n  const key = () => ['f', 'p', 'z', 'u'].map(k => `<span><span class=\"sw ${k}\"><\u002Fspan>${CREDIT[k]}<\u002Fspan>`).join('');\n  function tri(d) {\n    const parts = [], lab = [];\n    ['f', 'p', 'z', 'u'].forEach(k => {\n      if (!d[k]) return;\n      const w = pc(d[k], N);\n      parts.push(`<span class=\"${k}\" style=\"width:${w.toFixed(1)}%\">${w >= 7 ? d[k] : ''}<\u002Fspan>`);\n      lab.push(`${d[k]} ${CREDIT[k].toLowerCase()}`);\n    });\n    return `<div class=\"tri\" role=\"img\" aria-label=\"${lab.join(', ')}\" title=\"${lab.join(', ')}\">${parts.join('')}<\u002Fdiv>`;\n  }\n  const names = list => list.map(n => `<button type=\"button\" class=\"namebtn\" data-student=\"${esc(n)}\" aria-haspopup=\"dialog\">${esc(n)}<\u002Fbutton>`).join(', ');\n\n  // ---- panel structure\n  const PANELS = [\n    { id: 'p1', title: 'What this testlet suggests', chips: ['now', 'next'], serves: 'content reasoning criteria', render: renderSuggests },\n    { id: 'p2', title: 'Students by skill', chips: ['now'], serves: 'content', render: renderSkills },\n    { id: 'p3', title: R.dimensions[state.dim].title, chips: ['next'], serves: 'reasoning criteria', needs: 'practice', render: renderDims },\n    { id: 'p4', title: 'Where the class falls on this testlet', chips: ['next'], serves: 'content', needs: 'cuts', render: renderBuckets },\n    { id: 'p5', title: 'Student by item', chips: ['now', 'next'], serves: 'content reasoning', render: renderMatrix, allowBreak: true },\n    { id: 'p6', title: 'How students reasoned', chips: ['now', 'later'], serves: 'reasoning criteria', render: renderReasoning, allowBreak: true },\n    { id: 'p7', title: 'Suggested next moves', chips: ['now', 'next'], serves: 'content reasoning criteria', render: renderMoves },\n    { id: 'p8', title: 'Students to talk with first', chips: ['now', 'later'], serves: 'content reasoning', render: renderTalk }\n  ];\n\n  function renderHead() {\n    return `<div class=\"rpt-head\"><div><p class=\"program\">${esc(R.program)}<\u002Fp><h1>${esc(R.title)}<\u002Fh1><p class=\"sub\">${esc(R.classroom)}, ${N} of ${R.enrolled} students tested<\u002Fp><\u002Fdiv>\n      <dl class=\"meta\"><dt>Taken<\u002Fdt><dd>${esc(R.taken)}<\u002Fdd><dt>Class points<\u002Fdt><dd>${classPct} percent of ${avail} available<\u002Fdd><dt>Data<\u002Fdt><dd class=\"synthdd\">Synthetic, for illustration<\u002Fdd><\u002Fdl><\u002Fdiv>\n      <div class=\"use\" id=\"use\"><p class=\"u1\">${esc(R.uses.intro)}<\u002Fp>\n      <div class=\"ulist\" role=\"group\" aria-label=\"Focus the report on one use\">${R.uses.list.map(u => `<button type=\"button\" class=\"usebtn\" data-use=\"${u.id}\" aria-pressed=\"false\"><span class=\"u2\">${esc(u.want)}<\u002Fspan> <span class=\"u3\">${esc(u.so)}<\u002Fspan><\u002Fbutton>`).join('')}<\u002Fdiv>\n      <p class=\"hint\">Choose a use to dim the panels that do not serve it. Choose it again to clear.<\u002Fp><\u002Fdiv>`;\n  }\n\n  function renderSuggests() {\n    const S = R.suggests;\n    return `<div data-serves=\"content criteria\"><div class=\"sub-h\">The story in the content ${chip('next')}<\u002Fdiv>\n      <ol class=\"takeaways story\" data-needs=\"rules\">${S.story.map(t => `<li><b>${esc(t.lead)}<\u002Fb> ${t.text}<\u002Fli>`).join('')}<\u002Fol>\n      <p class=\"nextunit\" data-needs=\"rules\">${S.nextUnit}<\u002Fp><\u002Fdiv>\n      <div data-serves=\"reasoning\"><div class=\"sub-h\">The same story by practice ${chip('next')}<\u002Fdiv>\n      <ul class=\"nowlist\" data-needs=\"practice rules\">${S.byPractice.map(t => `<li>${t}<\u002Fli>`).join('')}<\u002Ful><\u002Fdiv>\n      <div data-serves=\"content\"><div class=\"sub-h\">What the credit export alone supports ${chip('now')}<\u002Fdiv>\n      <ul class=\"nowlist\">${S.creditOnly.map(t => `<li><b>${esc(t.lead)}<\u002Fb> ${t.text}<\u002Fli>`).join('')}<\u002Ful>\n      <p class=\"small\">${S.creditNote}<\u002Fp><\u002Fdiv>`;\n  }\n\n  function renderSkills() {\n    let rows = '';\n    R.clusters.forEach(c => {\n      rows += `<tr class=\"cluster\"><td colspan=\"5\">Cluster ${c.id}: ${esc(c.title)}<\u002Ftd><\u002Ftr>`;\n      items.filter(it => it.cluster === c.id).forEach(it => {\n        rows += `<tr><td class=\"n\">${it.id}<\u002Ftd><td class=\"w\">${esc(it.skill)}<\u002Ftd><td class=\"dim\"><b>${esc(it.standard)}<\u002Fb><\u002Ftd><td class=\"dim\" data-needs=\"practice\">${esc(it.practice)}<\u002Ftd><td>${tri(dist(it.id))}<\u002Ftd><\u002Ftr>`;\n      });\n    });\n    return `<p class=\"key\">${key()}<\u002Fp><table class=\"items sk\"><thead><tr><th scope=\"col\"><span class=\"sr\">Item<\u002Fspan><\u002Fth><th scope=\"col\">Skill<\u002Fth><th scope=\"col\">Standard<\u002Fth><th scope=\"col\"><span data-needs=\"practice\">Practice ${chip('next')}<\u002Fspan><\u002Fth><th scope=\"col\">Students, of ${N}<\u002Fth><\u002Ftr><\u002Fthead><tbody>${rows}<\u002Ftbody><\u002Ftable>`;\n  }\n\n  function renderDims() {\n    const D = R.dimensions;\n    return `<div class=\"dimbar\"><div class=\"seg\" id=\"dimToggle\" role=\"group\" aria-label=\"Group the class by\">${D.order.map(k => `<button type=\"button\" data-dim=\"${k}\" aria-pressed=\"${k === state.dim}\">${esc(D[k].label)}<\u002Fbutton>`).join('')}<\u002Fdiv><\u002Fdiv><div id=\"dimBody\"><\u002Fdiv>`;\n  }\n  function progStrip(row, it, D) {\n    const counts = new Array(D.legend.length).fill(0);\n    students.forEach(s => {\n      const v = score(s, it.id);\n      const lv = (v == null || v === 0) ? 0 : row.topLevel - (it.points - v);\n      counts[Math.max(0, Math.min(lv, counts.length - 1))]++;\n    });\n    const parts = [], lab = [];\n    counts.forEach((c, lv) => {\n      if (!c) return;\n      const L = D.legend[lv], w = pc(c, N);\n      parts.push(`<span class=\"cseg\" style=\"width:${w.toFixed(1)}%;background:${L.bg};color:${L.ink}${L.border ? ';box-shadow:inset 0 0 0 1px ' + L.border : ''}\">${w >= 7 ? c : ''}<\u002Fspan>`);\n      lab.push(`${c} ${L.label}`);\n    });\n    return `<div class=\"cstrip\" role=\"img\" aria-label=\"${lab.join(', ')}\" title=\"${lab.join(', ')}\">${parts.join('')}<\u002Fdiv>`;\n  }\n  function drawDims() {\n    const D = R.dimensions[state.dim];\n    const legend = D.mode === 'progression'\n      ? D.legend.map(L => `<span><i style=\"background:${L.bg};${L.border ? 'border:1px solid ' + L.border : ''}\"><\u002Fi>${esc(L.label)}<\u002Fspan>`).join('')\n      : key();\n    let h = `<p class=\"legend\">${legend}<\u002Fp>`;\n    D.rows.forEach(row => {\n      if (row.quiet) { h += `<div class=\"pracrow quiet\"><div class=\"pn\">${esc(row.name)}<\u002Fdiv><div><\u002Fdiv><div class=\"pt\">${row.text}<\u002Fdiv><\u002Fdiv>`; return; }\n      const it = items[ix[row.shownOn]];\n      const shown = `Shown on ${row.shownOn}` + (row.also && row.also.length ? `; also ${row.also.join(', ')}` : '');\n      const strip = D.mode === 'progression' ? progStrip(row, it, D) : `<div style=\"max-width:260px\">${tri(dist(it.id))}<\u002Fdiv>`;\n      h += `<div class=\"pracrow\"><div class=\"pn\">${esc(row.name)}<small>${shown}<\u002Fsmall><\u002Fdiv><div>${strip}<\u002Fdiv><div class=\"pt\" data-needs=\"rules\">${row.text}<\u002Fdiv><\u002Fdiv>`;\n    });\n    h += `<p class=\"small\" style=\"margin-top:8px\">${D.note}<\u002Fp>`;\n    $('#dimBody').innerHTML = h;\n    $('#p3 h2 .t').textContent = D.title;\n    $('#indexList [data-panel=\"p3\"] .t').textContent = D.title;\n    $$('#dimToggle button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dim === state.dim)));\n  }\n\n  function renderBuckets() {\n    return `<div class=\"buckets\">${bands.map(b => { const c = levelCount(b.id); return `<div><div class=\"bl\">${esc(b.label)}<\u002Fdiv><div class=\"bv\">${c} <small>of ${N}<\u002Fsmall><\u002Fdiv><div class=\"bar ${b.id}\"><i style=\"width:${pc(c, N).toFixed(0)}%\"><\u002Fi><\u002Fdiv><button type=\"button\" class=\"linkbtn\" data-level=\"${b.id}\">Show these students in the table<\u002Fbutton><\u002Fdiv>`; }).join('')}<\u002Fdiv>\n      <p class=\"small\" style=\"margin-top:8px\">${R.levels.note}<\u002Fp>`;\n  }\n\n  function renderMatrix() {\n    const opts = [{ id: 'all', short: 'All' }].concat(bands);\n    return `<div class=\"mx-controls\"><p class=\"key\">${key()}<\u002Fp>\n      <div class=\"lvl\" data-needs=\"cuts\"><span id=\"lvlLbl\">Show<\u002Fspan><div class=\"seg\" role=\"group\" aria-labelledby=\"lvlLbl\" id=\"lvlSeg\">${opts.map(b => `<button type=\"button\" data-level=\"${b.id}\" aria-pressed=\"${b.id === state.level}\">${esc(b.short)}<span class=\"cnt\">${b.id === 'all' ? N : levelCount(b.id)}<\u002Fspan><\u002Fbutton>`).join('')}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <p class=\"small mx-status\" id=\"mxStatus\" aria-live=\"polite\"><\u002Fp>\n      <div class=\"matrix-wrap\"><table class=\"matrix\" id=\"mx\" aria-describedby=\"mxStatus\"><\u002Ftable><\u002Fdiv>\n      <p class=\"small\" style=\"margin-top:10px\">${R.matrixNote}<\u002Fp>`;\n  }\n  function sortedStudents() {\n    const rows = students.filter(s => state.level === 'all' || s.level.id === state.level);\n    const dir = state.sortDir === 'asc' ? 1 : -1;\n    rows.sort((a, b) => {\n      if (state.sortKey === 'name') return a.name.localeCompare(b.name) * dir;\n      let va, vb;\n      if (state.sortKey === 'total') { va = a.total; vb = b.total; }\n      else { va = score(a, state.sortKey); vb = score(b, state.sortKey); va = va == null ? -1 : va; vb = vb == null ? -1 : vb; }\n      if (va !== vb) return (va - vb) * dir;\n      if (a.total !== b.total) return b.total - a.total;\n      return a.name.localeCompare(b.name);\n    });\n    return rows;\n  }\n  function drawMatrix() {\n    const rows = sortedStudents();\n    const dirWord = state.sortKey === 'name' ? (state.sortDir === 'asc' ? 'A to Z' : 'Z to A') : (state.sortDir === 'desc' ? 'high to low' : 'low to high');\n    const keyWord = state.sortKey === 'total' ? 'points' : state.sortKey === 'name' ? 'student name' : state.sortKey;\n    const lvl = state.level === 'all' ? '' : ` at ${bands.find(b => b.id === state.level).short}`;\n    $('#mxStatus').textContent = `Showing ${rows.length} of ${N} students${lvl}, sorted by ${keyWord}, ${dirWord}. Select a student for item detail.`;\n    const sortTh = (k, label, cls) => {\n      const active = state.sortKey === k;\n      const arrow = active ? (state.sortDir === 'asc' ? '↑' : '↓') : '';\n      return `<th scope=\"col\" class=\"${cls}\"${active ? ` aria-sort=\"${state.sortDir === 'asc' ? 'ascending' : 'descending'}\"` : ''}><button type=\"button\" class=\"sortbtn\" data-sort=\"${k}\" aria-label=\"Sort by ${esc(label)}\">${esc(label)}<span class=\"arr\" aria-hidden=\"true\">${arrow}<\u002Fspan><\u002Fbutton><\u002Fth>`;\n    };\n    let h = '<thead>';\n    h += `<tr><th class=\"name\"><\u002Fth>${R.clusters.map(c => `<th class=\"grp\" scope=\"colgroup\" colspan=\"${items.filter(it => it.cluster === c.id).length}\">${c.id}: ${esc(c.title)}<\u002Fth>`).join('')}<th class=\"grp\"><\u002Fth><th class=\"grp\"><\u002Fth><\u002Ftr>`;\n    h += `<tr>${sortTh('name', 'Student', 'name')}${items.map(it => sortTh(it.id, it.id, '')).join('')}${sortTh('total', 'Points', '')}<th scope=\"col\" class=\"lvlh\" data-needs=\"cuts\">Level<\u002Fth><\u002Ftr>`;\n    h += `<tr><th class=\"name rowlbl\">Points<\u002Fth>${items.map(it => `<th class=\"tag\">${it.points} pt<\u002Fth>`).join('')}<th class=\"tag\">of ${avail}<\u002Fth><th class=\"tag\" data-needs=\"cuts\">${chip('next')}<\u002Fth><\u002Ftr>`;\n    h += `<tr data-needs=\"practice\"><th class=\"name rowlbl\">Practice<\u002Fth>${items.map(it => `<th class=\"tag\">${esc(it.practiceShort)}<\u002Fth>`).join('')}<th class=\"tag\"><\u002Fth><th class=\"tag\"><\u002Fth><\u002Ftr>`;\n    h += `<tr data-needs=\"difficulty\"><th class=\"name rowlbl\">Difficulty<\u002Fth>${items.map(it => `<th class=\"tag\">${esc(it.difficulty)}<\u002Fth>`).join('')}<th class=\"tag\"><\u002Fth><th class=\"tag\"><\u002Fth><\u002Ftr>`;\n    h += '<\u002Fthead><tbody>';\n    rows.forEach(s => {\n      h += `<tr data-student=\"${esc(s.name)}\"${state.open === s.name ? ' class=\"open\"' : ''}><th scope=\"row\" class=\"name rowstu\"><button type=\"button\" class=\"stubtn\" aria-haspopup=\"dialog\">${esc(s.name)}<\u002Fbutton><\u002Fth>`;\n      h += items.map(it => { const v = score(s, it.id); return `<td><span class=\"cell ${credit(it, v)}\" data-item=\"${it.id}\" data-pts=\"${v == null ? '' : v}\">${v == null ? '–' : v}<\u002Fspan><\u002Ftd>`; }).join('');\n      h += `<td class=\"tot\">${s.total}<\u002Ftd><td class=\"br\" data-needs=\"cuts\"><span class=\"bracket ${s.level.id}\">${esc(s.level.short)}<\u002Fspan><\u002Ftd><\u002Ftr>`;\n    });\n    h += '<\u002Ftbody><tfoot>';\n    const full = items.map(it => rows.filter(s => score(s, it.id) >= it.points).length);\n    h += `<tr><th scope=\"row\" class=\"name\">Full credit<\u002Fth>${full.map(c => `<td>${c}<\u002Ftd>`).join('')}<td class=\"tot\"><\u002Ftd><td class=\"br\">students<\u002Ftd><\u002Ftr>`;\n    h += `<tr><th scope=\"row\" class=\"name\">Share full credit<\u002Fth>${full.map(c => `<td>${rows.length ? Math.round(c / rows.length * 100) : 0}%<\u002Ftd>`).join('')}<td class=\"tot\"><\u002Ftd><td class=\"br\">of ${rows.length}<\u002Ftd><\u002Ftr>`;\n    h += '<\u002Ftfoot>';\n    $('#mx').innerHTML = h;\n  }\n\n  const stepOf = s => { const v = score(s, R.reasoning.chain.item); const sc = v == null ? 0 : v; return R.reasoning.chain.steps.find(st => st.score === sc) || R.reasoning.chain.steps[R.reasoning.chain.steps.length - 1]; };\n  function renderReasoning() {\n    const Q = R.reasoning, C = Q.chain, it = items[ix[C.item]];\n    const counts = C.steps.map(st => students.filter(s => stepOf(s) === st).length);\n    return `<div data-serves=\"reasoning\"><div class=\"sub-h\">${esc(C.heading)} (${it.id}) ${chip('now')}<\u002Fdiv>\n      <p class=\"legend\">${C.steps.map(st => `<span><i style=\"background:${st.bg}\"><\u002Fi>${esc(st.label)}<\u002Fspan>`).join('')}<\u002Fp>\n      <div class=\"stack\" role=\"group\" aria-label=\"Steps in the explanation chain\">${C.steps.map((st, i) => counts[i] ? `<button type=\"button\" data-step=\"${i}\" aria-pressed=\"false\" style=\"width:${pc(counts[i], N).toFixed(1)}%;background:${st.bg};color:${st.ink}\" aria-label=\"${esc(st.label)}, ${plural(counts[i], 'student')}\">${counts[i]}<\u002Fbutton>` : '').join('')}<\u002Fdiv>\n      <p class=\"cer-names\" id=\"cerNames\">Choose a step to see which students stopped there.<\u002Fp><\u002Fdiv>\n      <div data-serves=\"reasoning\"><div class=\"sub-h\">Common wrong answers ${chip('later')}<\u002Fdiv>\n      <div class=\"ideas\">${Q.wrong.map(w => `<div class=\"idea\" data-needs=\"${w.needs}\"><div class=\"cnt\">${w.count} <small>of ${N}<\u002Fsmall><\u002Fdiv><p>${w.text}<\u002Fp><\u002Fdiv>`).join('')}<\u002Fdiv>\n      <p class=\"small\" style=\"margin-top:10px\">${Q.wrongNote}<\u002Fp><\u002Fdiv>\n      <div data-serves=\"criteria reasoning\"><div class=\"sub-h\">One response at each level, unnamed ${chip('later')}<\u002Fdiv>\n      <div data-needs=\"responses\">${Q.responses.map(r => `<div class=\"resp lv${r.level}\"><div class=\"who\"><b>${esc(r.label)}<\u002Fb>, ${esc(r.of)}<\u002Fdiv>${r.text}<\u002Fdiv>`).join('')}<\u002Fdiv>\n      <p class=\"small\">${Q.responsesNote}<\u002Fp><\u002Fdiv>`;\n  }\n  function drawCer() {\n    const C = R.reasoning.chain, el = $('#cerNames');\n    $$('.stack button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.step === state.cer)));\n    if (state.cer == null) { el.innerHTML = 'Choose a step to see which students stopped there.'; return; }\n    const st = C.steps[state.cer];\n    const who = students.filter(s => stepOf(s) === st).map(s => s.name);\n    const verb = st.verb ? `${st.verb} ${st.label.charAt(0).toLowerCase()}${st.label.slice(1)}` : st.label;\n    el.innerHTML = `<b>${esc(verb)}<\u002Fb> (${who.length}): ${names(who)}`;\n  }\n\n  function renderMoves() {\n    const M = R.moves;\n    return `<ol class=\"moves\">${M.list.map((m, i) => `<li class=\"move\" data-serves=\"${esc(m.serves)}\"><button type=\"button\" class=\"move-h\" aria-expanded=\"false\" aria-controls=\"mv${i}\"><span class=\"mt\"><b>${esc(m.title)}<\u002Fb> ${esc(m.summary)} <span data-needs=\"rules\">${esc(m.why)}<\u002Fspan><\u002Fspan><span class=\"tw\" aria-hidden=\"true\">More<\u002Fspan><\u002Fbutton>\n      <div class=\"move-body\" id=\"mv${i}\" hidden><h4>Full description<\u002Fh4><p>${m.full}<\u002Fp><h4>Off-roads<\u002Fh4><ul>${m.offroads.map(o => `<li>${o}<\u002Fli>`).join('')}<\u002Ful><\u002Fdiv><\u002Fli>`).join('')}<\u002Fol>\n      <p class=\"res\">${M.resources.map(r => `<span${r.later ? ' class=\"later\"' : ''}>${esc(r.label)}<\u002Fspan>`).join('')}<\u002Fp>`;\n  }\n\n  function renderTalk() {\n    return `<div class=\"watch\">${R.talkWith.map(g => `<div${g.needs ? ` data-needs=\"${g.needs}\"` : ''}><h3>${esc(g.title)}<\u002Fh3><p>${names(g.students)} ${g.text}<\u002Fp><\u002Fdiv>`).join('')}<\u002Fdiv>`;\n  }\n\n  function renderFine() {\n    const F = R.finePrint;\n    return `<b>${esc(F.lead)}<\u002Fb> ${N} of ${R.enrolled} students tested. The class earned ${classPct} percent of the available points. Standards on this testlet: ${esc(R.standardsText)}. ${F.text} <span class=\"synthline\">${esc(F.synthetic)}<\u002Fspan> ${esc(F.readiness)} <button type=\"button\" class=\"linkbtn\" id=\"hownotBtn\" aria-haspopup=\"dialog\">${esc(R.howNotToUse.title)}<\u002Fbutton>`;\n  }\n\n  // ---- mount\n  $('#platName').textContent = R.platform;\n  $('#chipKey').innerHTML = chips(['now', 'next', 'later']);\n  $('#head').innerHTML = renderHead();\n  $('#panels').innerHTML = PANELS.map((p, i) => `<section class=\"panel${p.allowBreak ? ' allow-break' : ''}\" id=\"${p.id}\" data-serves=\"${p.serves}\"${p.needs ? ` data-needs=\"${p.needs}\"` : ''} aria-labelledby=\"${p.id}h\"><div class=\"panel-h\"><h2 id=\"${p.id}h\"><span class=\"n\">${i + 1}.<\u002Fspan><span class=\"t\">${esc(p.title)}<\u002Fspan><\u002Fh2>${chips(p.chips)}<\u002Fdiv>${p.render()}<\u002Fsection>`).join('');\n  $('#fine').innerHTML = renderFine();\n  $('#indexList').innerHTML = PANELS.map((p, i) => `<li data-panel=\"${p.id}\"><a href=\"#${p.id}\"><span class=\"n\">${i + 1}<\u002Fspan><span class=\"t\">${esc(p.title)}<\u002Fspan><\u002Fa><\u002Fli>`).join('') + `<li data-panel=\"fine\"><a href=\"#fine\"><span class=\"n\"><\u002Fspan><span class=\"t\">Fine print<\u002Fspan><\u002Fa><\u002Fli>`;\n  $('#hownot').innerHTML = `<h2 id=\"hownotTitle\">${esc(R.howNotToUse.title)}<\u002Fh2><ul>${R.howNotToUse.rules.map(r => `<li>${esc(r)}<\u002Fli>`).join('')}<\u002Ful><button type=\"button\" class=\"close\">Close<\u002Fbutton>`;\n  $('#hownotPrint').innerHTML = `<h2>${esc(R.howNotToUse.title)}<\u002Fh2><ul>${R.howNotToUse.rules.map(r => `<li>${esc(r)}<\u002Fli>`).join('')}<\u002Ful>`;\n  $('#todayBanner .in').innerHTML = `<b>Showing what the credit export supports today.<\u002Fb> Dimmed: ${Object.values(NEEDS).join(', ')}. Hover a dimmed element to see what it needs. Switch off to restore the full report.`;\n  drawDims(); drawMatrix();\n\n  // ---- layout helpers\n  const header = $('#topbar'), nav = $('nav.index'), banner = $('#todayBanner'), sw = $('#todaySwitch');\n  const tip = $('#tip'), drawer = $('#drawer'), dlg = $('#hownot');\n  const narrow = () => matchMedia('(max-width:1000px)').matches;\n  const topOffset = () => header.offsetHeight + (narrow() ? nav.offsetHeight : 0);\n  function updateTop() { document.documentElement.style.setProperty('--top', header.offsetHeight + 'px'); }\n  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  function scrollToEl(el) {\n    const y = window.scrollY + el.getBoundingClientRect().top - topOffset() - 12;\n    window.scrollTo({ top: Math.max(0, y), behavior: reduced ? 'auto' : 'smooth' });\n  }\n\n  // ---- panel index / scroll spy\n  const sections = PANELS.map(p => $('#' + p.id)).concat([$('#fine')]);\n  function spy() {\n    const off = topOffset() + 48;\n    let cur = sections[0];\n    sections.forEach(s => { if (s.getBoundingClientRect().top <= off) cur = s; });\n    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 2) cur = sections[sections.length - 1];\n    $$('#indexList a').forEach(a => { const on = a.getAttribute('href') === '#' + cur.id; if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });\n  }\n  let ticking = false;\n  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { spy(); ticking = false; }); } }, { passive: true });\n  addEventListener('resize', () => { updateTop(); spy(); });\n\n  // ---- use statements\n  function setUse(id) {\n    state.use = state.use === id ? null : id;\n    $$('.usebtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.use === state.use)));\n    $('#use').classList.toggle('has', !!state.use);\n    $$('[data-serves]').forEach(el => el.classList.toggle('dim-use', !!state.use && !el.dataset.serves.split(/\\s+/).includes(state.use)));\n    $$('#indexList li').forEach(li => { const p = document.getElementById(li.dataset.panel); li.classList.toggle('dim-use', !!(state.use && p && p.dataset.serves && !p.dataset.serves.split(/\\s+/).includes(state.use))); });\n  }\n\n  // ---- today switch\n  function setToday(on) {\n    state.today = on;\n    document.body.classList.toggle('today', on);\n    sw.setAttribute('aria-checked', String(on));\n    $('.st', sw).textContent = on ? 'On' : 'Off';\n    banner.hidden = !on;\n    updateTop();\n  }\n\n  // ---- matrix state\n  function setSort(k) {\n    if (state.sortKey === k) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';\n    else { state.sortKey = k; state.sortDir = k === 'name' ? 'asc' : 'desc'; }\n    drawMatrix();\n    const b = $(`#mx .sortbtn[data-sort=\"${k}\"]`); if (b) b.focus();\n  }\n  function setLevel(id) {\n    state.level = id;\n    $$('#lvlSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.level === id)));\n    drawMatrix();\n  }\n\n  // ---- student drawer\n  let opener = null;\n  function openStudent(name, from) {\n    const s = byName[name]; if (!s) return;\n    opener = from || document.activeElement;\n    state.open = name;\n    const Q = R.reasoning, C = Q.chain, st = stepOf(s), chainItem = items[ix[C.item]];\n    const itemRow = it => { const v = score(s, it.id); const k = credit(it, v); return `<div class=\"ditem\"><div><span class=\"cell ${k}\">${v == null ? '–' : v}<\u002Fspan><div class=\"idlab\">${it.id} · ${it.points} pt<\u002Fdiv><\u002Fdiv><div><div class=\"sk\">${esc(it.skill)}<\u002Fdiv><div class=\"cm\">${v == null ? 'Unanswered.' : esc(it.credit[v] || CREDIT[k])}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`; };\n    const groups = R.talkWith.filter(g => g.students.includes(name)).map(g => g.title);\n    const v0 = score(s, C.item);\n    drawer.innerHTML = `<div class=\"drawer-h\"><div><p class=\"program\">Student detail<\u002Fp><h2 id=\"drawerTitle\" tabindex=\"-1\">${esc(name)}<\u002Fh2><\u002Fdiv><button type=\"button\" class=\"close\" aria-label=\"Close student detail\">×<\u002Fbutton><\u002Fdiv>\n      <p class=\"sum\"><b>${s.total} of ${avail} points<\u002Fb><span data-needs=\"cuts\"><span class=\"bracket ${s.level.id}\">${esc(s.level.short)}<\u002Fspan> <span class=\"small\">placeholder cut points<\u002Fspan><\u002Fspan><\u002Fp>\n      <h3>Reasoning<\u002Fh3>\n      <div class=\"ditem\"><div><span class=\"cell ${credit(chainItem, v0)}\">${v0 == null ? '–' : v0}<\u002Fspan><div class=\"idlab\">${chainItem.id} · ${chainItem.points} pt<\u002Fdiv><\u002Fdiv><div><div class=\"sk\">${esc(st.label)}<\u002Fdiv><div class=\"cm\">${v0 == null ? 'Unanswered.' : esc(chainItem.credit[v0] || '')}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      ${Q.drawerItems.map(id => itemRow(items[ix[id]])).join('')}\n      <h3>All items<\u002Fh3>${items.map(itemRow).join('')}\n      <p class=\"small\" style=\"margin-top:10px\" data-needs=\"patterns rationales\">The answer this student chose on each item would appear here. The vendor returns credit only today.<\u002Fp>\n      ${groups.length ? `<h3>In this report<\u002Fh3><p class=\"groups\">Students to talk with first: ${esc(groups.join('; '))}.<\u002Fp>` : ''}`;\n    drawer.hidden = false;\n    $$('#mx tbody tr').forEach(tr => tr.classList.toggle('open', tr.dataset.student === name));\n    $('#drawerTitle').focus();\n  }\n  function closeDrawer() {\n    if (drawer.hidden) return;\n    drawer.hidden = true; state.open = null;\n    $$('#mx tbody tr.open').forEach(tr => tr.classList.remove('open'));\n    if (opener && document.contains(opener)) opener.focus();\n    opener = null;\n  }\n\n  // ---- tooltip\n  function showTip(html, rect) {\n    tip.innerHTML = html; tip.hidden = false;\n    const tw = tip.offsetWidth, th = tip.offsetHeight;\n    let x = rect.left + rect.width / 2 - tw / 2; x = Math.max(8, Math.min(x, innerWidth - tw - 8));\n    let y = rect.bottom + 8; if (y + th > innerHeight - 8) y = rect.top - th - 8;\n    tip.style.left = x + 'px'; tip.style.top = y + 'px';\n  }\n  document.addEventListener('mouseover', e => {\n    if (!(e.target instanceof Element)) return;\n    const cell = e.target.closest('#mx tbody .cell');\n    if (cell) {\n      const it = items[ix[cell.dataset.item]], v = cell.dataset.pts === '' ? null : +cell.dataset.pts;\n      const name = cell.closest('tr').dataset.student;\n      const meaning = v == null ? 'Unanswered.' : `${v} of ${plural(it.points, 'point')}: ${esc(it.credit[v] || CREDIT[credit(it, v)])}`;\n      showTip(`<b>${esc(name)} · ${it.id} · ${esc(it.difficulty)}<\u002Fb><br>${esc(it.skill)}<br>${meaning}`, cell.getBoundingClientRect());\n      return;\n    }\n    if (state.today) {\n      const el = e.target.closest('[data-needs]');\n      if (el && !el.closest('.todaybanner')) { showTip(`<b>Not in today’s export<\u002Fb><br>Needs ${esc(needsLabel(el.dataset.needs))}.`, { left: e.clientX, width: 0, bottom: e.clientY + 14, top: e.clientY - 6 }); return; }\n    }\n    tip.hidden = true;\n  });\n  document.addEventListener('mouseout', e => { if (e.target instanceof Element && (e.target.closest('#mx tbody .cell') || e.target.closest('[data-needs]'))) tip.hidden = true; });\n  document.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });\n\n  // ---- events\n  document.addEventListener('click', e => {\n    if (!(e.target instanceof Element)) return;\n    const t = e.target;\n    const a = t.closest('#indexList a');\n    if (a) { e.preventDefault(); const el = document.querySelector(a.getAttribute('href')); if (el) { scrollToEl(el); history.replaceState(null, '', a.getAttribute('href')); } return; }\n    const ub = t.closest('.usebtn'); if (ub) { setUse(ub.dataset.use); return; }\n    if (t.closest('#todaySwitch')) { setToday(!state.today); return; }\n    const db = t.closest('#dimToggle button'); if (db) { state.dim = db.dataset.dim; drawDims(); return; }\n    const sb = t.closest('.sortbtn'); if (sb) { setSort(sb.dataset.sort); return; }\n    const lb = t.closest('#lvlSeg button'); if (lb) { setLevel(lb.dataset.level); return; }\n    const bl = t.closest('.linkbtn[data-level]'); if (bl) { setLevel(bl.dataset.level); scrollToEl($('#p5')); return; }\n    const nb = t.closest('.namebtn[data-student]'); if (nb) { openStudent(nb.dataset.student, nb); return; }\n    const tr = t.closest('#mx tbody tr'); if (tr) { openStudent(tr.dataset.student, tr.querySelector('.stubtn')); return; }\n    const stp = t.closest('.stack button'); if (stp) { const i = +stp.dataset.step; state.cer = state.cer === i ? null : i; drawCer(); return; }\n    const mh = t.closest('.move-h'); if (mh) { const open = mh.getAttribute('aria-expanded') === 'true'; mh.setAttribute('aria-expanded', String(!open)); document.getElementById(mh.getAttribute('aria-controls')).hidden = open; $('.tw', mh).textContent = open ? 'More' : 'Less'; return; }\n    if (t.closest('#hownotBtn')) { opener = t.closest('#hownotBtn'); dlg.showModal(); return; }\n    if (t.closest('#hownot .close')) { dlg.close(); return; }\n    if (t.closest('#drawer .close')) { closeDrawer(); return; }\n  });\n  dlg.addEventListener('close', () => { if (opener && document.contains(opener)) opener.focus(); });\n  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });\n  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !dlg.open) closeDrawer(); });\n\n  // ---- init\n  updateTop(); spy();\n  if (location.hash) { const el = document.querySelector(location.hash); if (el) setTimeout(() => scrollToEl(el), 50); }\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
